<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VUS Hub — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --bg-elevated: #111827;
    --card: rgba(17, 24, 39, 0.6);
    --card-hover: rgba(30, 41, 59, 0.7);
    --border: rgba(51, 65, 85, 0.5);
    --border-hover: rgba(74, 222, 128, 0.3);
    --fg: #f1f5f9;
    --fg-muted: #94a3b8;
    --fg-dim: #475569;
    --accent: #22c55e;
    --accent-glow: rgba(34, 197, 94, 0.15);
    --accent-soft: rgba(34, 197, 94, 0.08);
    --danger: #ef4444;
    --radius: 14px;
    --font: 'Space Grotesk', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    color: var(--fg);
    font-family: var(--font);
  }

  body {
    padding: 4px 2px 24px;
  }

  .home-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .home-sub {
    font-size: 13px;
    color: var(--fg-muted);
    margin-bottom: 22px;
  }

  .widget-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  @media (max-width: 700px) {
    .widget-grid { grid-template-columns: 1fr; }
  }

  .widget-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    backdrop-filter: blur(12px);
    transition: border-color 0.25s, background 0.25s;
  }

  .widget-card:hover {
    border-color: var(--border-hover);
    background: var(--card-hover);
  }

  .widget-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 14px;
  }

  .widget-header .emoji {
    font-size: 16px;
    line-height: 1;
  }

  /* ---- List rows (Recently Used / Featured) ---- */
  .widget-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .widget-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 8px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s;
    text-decoration: none;
    color: inherit;
  }

  .widget-row:hover {
    background: rgba(255,255,255,0.04);
  }

  .row-icon {
    width: 28px; height: 28px;
    min-width: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }

  .row-icon.green { background: rgba(34,197,94,0.12); color: #4ade80; }
  .row-icon.blue { background: rgba(59,130,246,0.12); color: #60a5fa; }
  .row-icon.amber { background: rgba(245,158,11,0.12); color: #fbbf24; }
  .row-icon.rose { background: rgba(244,63,94,0.12); color: #fb7185; }
  .row-icon.violet { background: rgba(139,92,246,0.12); color: #a78bfa; }
  .row-icon.cyan { background: rgba(6,182,212,0.12); color: #22d3ee; }
  .row-icon.lime { background: rgba(132,204,22,0.12); color: #a3e635; }
  .row-icon.orange { background: rgba(249,115,22,0.12); color: #fb923c; }
  .row-icon.red { background: rgba(239,68,68,0.12); color: #f87171; }
  .row-icon.black { background: rgba(148,163,184,0.12); color: #cbd5e1; }

  .row-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .widget-empty {
    font-size: 13px;
    color: var(--fg-dim);
    padding: 8px;
  }

  /* ---- Online now ---- */
  .online-stat {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .online-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .online-count {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--fg);
  }

  .online-label {
    font-size: 12px;
    color: var(--fg-muted);
  }

  /* ---- Socials ---- */
  .social-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s;
    text-decoration: none;
    color: inherit;
  }

  .social-row:hover {
    background: rgba(255,255,255,0.04);
  }

  .social-icon {
    width: 28px; height: 28px;
    min-width: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
  }

  .social-icon svg {
    width: 15px; height: 15px;
    color: var(--fg-muted);
  }

  .social-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
  }
</style>
</head>
<body>

<div class="home-title">👋 Welcome to VUS</div>
<div class="home-sub">Your dashboard for everything VUS Hub</div>

<div class="widget-grid">

  <!-- Recently Used -->
  <div class="widget-card">
    <div class="widget-header"><span class="emoji">🔥</span> Recently Used</div>
    <div class="widget-list" id="recentList"></div>
  </div>

  <!-- Featured -->
  <div class="widget-card">
    <div class="widget-header"><span class="emoji">⭐</span> Featured</div>
    <div class="widget-list" id="featuredList"></div>
  </div>

  <!-- Online Now -->
  <div class="widget-card">
    <div class="widget-header"><span class="emoji">🌐</span> Online Now</div>
    <div class="online-stat">
      <span class="online-dot"></span>
      <div>
        <div class="online-count" id="onlineCount">12</div>
        <div class="online-label">users online</div>
      </div>
    </div>
  </div>

  <!-- Socials -->
  <div class="widget-card">
    <div class="widget-header"><span class="emoji">🔗</span> Socials</div>
    <div class="widget-list" id="socialsList">
      <a class="social-row" href="#" target="_blank" rel="noopener">
        <span class="social-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.78-.25.78-.55 0-.27-.01-1-.02-1.96-3.2.7-3.88-1.54-3.88-1.54-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.6.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.42.36.78 1.08.78 2.18 0 1.57-.01 2.84-.01 3.23 0 .3.2.66.79.55A10.51 10.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
        </span>
        <span class="social-name">GitHub</span>
      </a>
      <a class="social-row" href="#" target="_blank" rel="noopener">
        <span class="social-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.32 4.37a19.8 19.8 0 0 0-4.9-1.52.07.07 0 0 0-.08.04c-.21.38-.45.86-.61 1.25a18.3 18.3 0 0 0-5.48 0 12.6 12.6 0 0 0-.62-1.25.08.08 0 0 0-.08-.04c-1.7.29-3.36.8-4.9 1.52a.07.07 0 0 0-.03.03C.99 8.5.24 12.5.6 16.45a.08.08 0 0 0 .03.06 19.9 19.9 0 0 0 5.99 3.03.08.08 0 0 0 .08-.03c.46-.63.87-1.29 1.23-1.99a.07.07 0 0 0-.04-.1 13.1 13.1 0 0 1-1.87-.89.08.08 0 0 1 0-.13c.13-.09.25-.19.37-.28a.08.08 0 0 1 .08-.01c3.93 1.79 8.18 1.79 12.06 0a.08.08 0 0 1 .08.01c.12.1.24.19.37.28a.08.08 0 0 1 0 .13c-.6.35-1.22.65-1.87.89a.08.08 0 0 0-.04.1c.37.7.78 1.36 1.23 1.99a.07.07 0 0 0 .08.03 19.85 19.85 0 0 0 6-3.03.08.08 0 0 0 .03-.06c.44-4.57-.74-8.53-3.13-12.05a.06.06 0 0 0-.03-.03ZM8.02 14.09c-1.18 0-2.15-1.08-2.15-2.4 0-1.33.95-2.41 2.15-2.41 1.21 0 2.17 1.09 2.15 2.41 0 1.32-.95 2.4-2.15 2.4Zm7.97 0c-1.18 0-2.15-1.08-2.15-2.4 0-1.33.96-2.41 2.15-2.41 1.21 0 2.17 1.09 2.15 2.41 0 1.32-.94 2.4-2.15 2.4Z"/></svg>
        </span>
        <span class="social-name">Discord</span>
      </a>
      <a class="social-row" href="#" target="_blank" rel="noopener">
        <span class="social-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.58 7.19a2.75 2.75 0 0 0-1.94-1.95C17.9 4.75 12 4.75 12 4.75s-5.9 0-7.64.49a2.75 2.75 0 0 0-1.94 1.95C2 8.93 2 12 2 12s0 3.07.42 4.81a2.75 2.75 0 0 0 1.94 1.95c1.74.49 7.64.49 7.64.49s5.9 0 7.64-.49a2.75 2.75 0 0 0 1.94-1.95C22 15.07 22 12 22 12s0-3.07-.42-4.81ZM9.75 15.02V8.98L15.5 12l-5.75 3.02Z"/></svg>
        </span>
        <span class="social-name">YouTube</span>
      </a>
    </div>
  </div>

</div>

<script>
// ===================== FEATURED (hardcoded) =====================
const FEATURED_APPS = [
  { name: "VUS Launcher", icon: "🎮", color: "green" },
  { name: "VUS AI", icon: "AI", color: "violet" },
  { name: "Chat Room", icon: "Chat", color: "blue" }
];

// ===================== RECENTLY USED (from localStorage) =====================
const RECENT_APPS_KEY = "vus_recent_apps";

function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function rowIcon(icon, color, name) {
  const label = icon || (name || "").substring(0, 2).toUpperCase();
  return `<span class="row-icon ${color || 'green'}">${escapeHtml(label)}</span>`;
}

function renderFeatured() {
  const list = document.getElementById("featuredList");
  list.innerHTML = FEATURED_APPS.map(app => `
    <div class="widget-row">
      ${rowIcon(app.icon, app.color, app.name)}
      <span class="row-name">${escapeHtml(app.name)}</span>
    </div>
  `).join("");
}

function renderRecent() {
  const list = document.getElementById("recentList");
  let recent = [];
  try {
    recent = JSON.parse(localStorage.getItem(RECENT_APPS_KEY) || "[]");
  } catch (e) {
    recent = [];
  }

  if (!recent.length) {
    list.innerHTML = '<div class="widget-empty">Nothing opened yet — your recent apps will show up here.</div>';
    return;
  }

  list.innerHTML = recent.slice(0, 5).map(app => `
    <div class="widget-row">
      ${rowIcon(app.icon, app.color, app.name)}
      <span class="row-name">${escapeHtml(app.name)}</span>
    </div>
  `).join("");
}

renderFeatured();
renderRecent();

// Refresh "Recently Used" if the parent tab logs a new click while Home is open
// (storage event fires across same-origin documents, e.g. this iframe + the parent)
window.addEventListener("storage", (e) => {
  if (e.key === RECENT_APPS_KEY) renderRecent();
});
</script>
</body>
</html>
