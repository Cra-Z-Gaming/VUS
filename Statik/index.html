<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statik</title>
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <h1 class="logo">Statik</h1>
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search titles...">
    </div>
    <div id="reset-timer" class="reset-timer"></div>
    <button id="new-post-btn">＋ New Post</button>
  </header>

  <!-- ===== MAIN VIEWER ===== -->
  <main id="viewer" class="viewer">
    <button id="prev-btn" class="nav-btn nav-up" title="Previous (↑)">▲</button>

    <div id="post-stage" class="post-stage">
      <p id="empty-state" class="empty-state hidden">No posts yet. Be the first.</p>
      <!-- Active post card gets rendered here -->
    </div>

    <button id="next-btn" class="nav-btn nav-down" title="Next (↓)">▼</button>

    <div id="post-counter" class="post-counter"></div>
  </main>

  <!-- ===== COMMENTS PANEL ===== -->
  <aside id="comments-panel" class="comments-panel">
    <div class="comments-header">
      <span>Comments</span>
      <span id="comments-count" class="comments-count"></span>
    </div>
    <div id="comments-list" class="comments-list"></div>
    <form id="comment-form" class="comment-form">
      <input type="text" id="comment-input" placeholder="Add a comment..." maxlength="500" required>
      <button type="submit">Post</button>
    </form>
  </aside>

  <!-- ===== NEW POST MODAL ===== -->
  <div id="post-modal" class="modal hidden">
    <div class="modal-box">
      <h2>New Post</h2>

      <input type="text" id="title-input" placeholder="Title" maxlength="100" required>
      <textarea id="desc-input" placeholder="Description (optional)" maxlength="1000"></textarea>

      <label class="file-label">
        <input type="file" id="file-input" accept="image/*">
        <span id="file-label-text">Attach image (optional)</span>
      </label>
      <img id="preview-img" class="hidden">

      <div class="modal-actions">
        <button id="cancel-post-btn" type="button">Cancel</button>
        <button id="submit-post-btn" type="button">Post</button>
      </div>
      <p id="post-status"></p>
    </div>
  </div>

  <!-- ===== FULLSCREEN IMAGE VIEW ===== -->
  <div id="fullscreen-overlay" class="fullscreen-overlay hidden">
    <button id="fullscreen-close-btn" class="fullscreen-close">✕</button>
    <img id="fullscreen-img" class="fullscreen-img">
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

  <script>
  /* ══════════════════════════════════════════════════════════
     EXTERNAL FILE LOADER
     raw.githubusercontent.com serves everything as Content-Type:
     text/plain, so a plain <link rel="stylesheet"> or <script src>
     pointed at it gets silently blocked by the browser's strict
     MIME-type check. Instead we fetch the raw text ourselves and
     inject it: CSS goes into a <style> tag, JS gets wrapped in a
     Blob URL (so it still shows up as a real file in devtools,
     unlike eval/new Function) and loaded as a normal <script src>.
     Load order: style.css -> firebase-config.js -> app.js
     (app.js depends on firebase being configured first).
     ══════════════════════════════════════════════════════════ */
  (function loadExternalAppFiles() {
    var BASE = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/refs/heads/main/Statik/";
    var CSS_URL    = BASE + "style.css";
    var CONFIG_URL = BASE + "firebase-config.js";
    var JS_URL     = BASE + "app.js";

    function showLoadError(what, err) {
      document.body.innerHTML =
        "<div style='padding:24px;color:#f1f5f9;font-family:Arial,sans-serif;background:#0f172a;min-height:100vh'>" +
        "<h2>Couldn't load " + what + "</h2>" +
        "<p style='color:#94a3b8;font-size:14px;margin-top:8px;line-height:1.5'>" +
        (err && err.message ? err.message : String(err)) +
        "<br><br>Check that the file exists at the expected GitHub path and the repo/branch is public." +
        "</p></div>";
    }

    function loadCss() {
      return fetch(CSS_URL, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status + " fetching style.css");
          return r.text();
        })
        .then(function (cssText) {
          var styleEl = document.createElement("style");
          styleEl.textContent = cssText;
          document.head.appendChild(styleEl);
        });
    }

    function loadScriptFromUrl(url, label) {
      return fetch(url, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status + " fetching " + label);
          return r.text();
        })
        .then(function (jsText) {
          var blob = new Blob([jsText], { type: "application/javascript" });
          var blobUrl = URL.createObjectURL(blob);
          return new Promise(function (resolve, reject) {
            var scriptEl = document.createElement("script");
            scriptEl.src = blobUrl;
            scriptEl.onload = resolve;
            scriptEl.onerror = function () { reject(new Error(label + " failed to execute — check it for syntax errors.")); };
            document.body.appendChild(scriptEl);
          });
        });
    }

    loadCss()
      .catch(function (err) { showLoadError("styles (style.css)", err); throw err; })
      .then(function () { return loadScriptFromUrl(CONFIG_URL, "firebase-config.js"); })
      .catch(function (err) {
        if (!document.body.querySelector("h2")) showLoadError("Firebase config (firebase-config.js)", err);
        throw err;
      })
      .then(function () { return loadScriptFromUrl(JS_URL, "app.js"); })
      .catch(function (err) {
        if (!document.body.querySelector("h2")) showLoadError("app logic (app.js)", err);
      });
  })();
  </script>
</body>
</html>
