<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statik — Submit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { color-scheme: dark; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid #4da3ff; outline-offset: 2px; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e0e0e; color: #f2f2f2; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 24px; width: 440px; max-width: 100%; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .note { color: #9a9a9a; font-size: 13px; margin-bottom: 16px; }
  input[type=text], textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #2a2a2a; background: #1f1f1f; color: #f2f2f2; font: inherit; font-size: 16px; margin-bottom: 4px; }
  textarea { min-height: 90px; resize: vertical; }
  .ctr { font-size: 11px; color: #9a9a9a; text-align: right; margin-bottom: 10px; }
  .file { display: block; border: 1px dashed #2a2a2a; border-radius: 8px; padding: 14px; text-align: center; font-size: 13px; color: #9a9a9a; cursor: pointer; margin-bottom: 12px; }
  .file:hover { border-color: #4da3ff; }
  .file input { display: none; }
  #preview { width: 100%; max-height: 220px; object-fit: contain; background: #000; border-radius: 8px; margin-bottom: 12px; display: none; }
  button { width: 100%; background: #4da3ff; color: #06172b; border: none; border-radius: 6px; padding: 11px; font-weight: 700; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 10px; font-size: 13px; color: #9a9a9a; min-height: 18px; }
  #status.ok { color: #4dff9a; } #status.err { color: #ff8a9e; }
  #vpreview { width: 100%; max-height: 220px; background: #000; border-radius: 8px; margin-bottom: 12px; display: none; }
  .bar { height: 6px; border-radius: 99px; background: #2a2a2a; overflow: hidden; margin-top: 10px; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: #4da3ff; transition: width .2s; }
</style>
</head>
<body>
<main class="box">
  <h1>Submit a post</h1>
  <p class="note">Posts are reviewed by admins and can take up to 3 days to be published. Paste (Ctrl/Cmd+V) works for images.</p>
  <input type="text" id="title" placeholder="Title" maxlength="100">
  <div class="ctr" id="title-ctr">0/100</div>
  <textarea id="desc" placeholder="Description (optional)" maxlength="1000"></textarea>
  <div class="ctr" id="desc-ctr">0/1000</div>
  <label class="file"><input type="file" id="file" accept="image/*"><span id="file-text">Attach image (optional)</span></label>
  <img id="preview" alt="">
  <label class="file"><input type="file" id="vfile" accept="video/*"><span id="vfile-text">Attach video (optional, up to 1 minute)</span></label>
  <video id="vpreview" controls playsinline></video>
  <div class="bar" id="vbar"><i></i></div>
  <button id="submit">Submit for review</button>
  <p id="status"></p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyB4jCgU3rD5wDhOSJaGCAXC4ESIIuhFa0E",
  authDomain: "vus-static.firebaseapp.com",
  databaseURL: "https://vus-static-default-rtdb.firebaseio.com",
  projectId: "vus-static",
  appId: "1:1056211291218:web:9e8e9c5874264ed78fe38b"
});
const db = firebase.database(), auth = firebase.auth();
const $ = (id) => document.getElementById(id);
const MIN_ASPECT = 0.4, MAX_ASPECT = 2.5, MAX_DIM = 1280, QUALITY = 0.72, COOLDOWN_MS = 15000;
let imageData = null;

const ready = new Promise((res, rej) => auth.onAuthStateChanged((u) => {
  if (u) res(u); else auth.signInAnonymously().catch(rej);
}));
ready.catch(() => {}); // the submit handler reports a failed connection

function setStatus(msg, cls) { $('status').textContent = msg; $('status').className = cls || ''; }
$('title').addEventListener('input', () => { $('title-ctr').textContent = `${$('title').value.length}/100`; });
$('desc').addEventListener('input', () => { $('desc-ctr').textContent = `${$('desc').value.length}/1000`; });

function processImage(file, label) {
  if (!file.type.startsWith('image/')) return setStatus('Please choose an image file.', 'err');
  const img = new Image();
  img.onload = () => {
    const ratio = img.width / img.height;
    if (ratio < MIN_ASPECT || ratio > MAX_ASPECT) return setStatus('Aspect ratio too extreme — please crop it.', 'err');
    let w = img.width, h = img.height;
    if (w > h && w > MAX_DIM) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
    else if (h >= w && h > MAX_DIM) { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // JPEG has no alpha: transparent PNGs would turn black
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(img.src);
    const data = c.toDataURL('image/jpeg', QUALITY);
    if (data.length >= 2800000) return setStatus('Image is too large even after compression.', 'err');
    imageData = data; clearVideo();
    $('preview').src = data; $('preview').style.display = 'block';
    $('file-text').textContent = label || file.name || 'Pasted image';
    setStatus('');
  };
  img.onerror = () => setStatus('Could not read that image.', 'err');
  img.src = URL.createObjectURL(file);
}
$('file').addEventListener('change', () => { if ($('file').files[0]) processImage($('file').files[0]); });
document.addEventListener('paste', (e) => {
  for (const it of (e.clipboardData && e.clipboardData.items) || []) {
    if (it.type.startsWith('image/')) { e.preventDefault(); processImage(it.getAsFile(), 'Pasted image'); return; }
  }
});

/* ---------- video: re-encoded in the browser, stored as base64 chunks in the database ---------- */
const VIDEO_MAX_SEC = 60, VIDEO_TARGET = 2200000, VIDEO_MAX_BYTES = 2800000, CHUNK = 240000;
let pendingVideo = null, encodePromise = null, localUrl = null, videoToken = 0, bg = false, lastLabel = '', videoId = null, uploaded = false;
// Messages to the page that hosts this form (it shows a small progress pill while we post in the background).
const tell = (msg) => { try { parent.postMessage(msg, '*'); } catch (e) {} };
function setVideoProgress(label, frac) {
  const bar = $('vbar');
  if (label == null) { bar.style.display = 'none'; return; }
  bar.style.display = 'block'; bar.firstElementChild.style.width = Math.round(Math.max(0, Math.min(1, frac || 0)) * 100) + '%';
  setStatus(label);
  if (bg && label !== lastLabel) { lastLabel = label; tell({ type: 'statik-progress', label, frac }); }
}
function clearVideo(keep) {
  const oldId = videoId;
  videoToken++;
  if (oldId && !keep) db.ref('submissionVideos/' + oldId).remove().catch(() => {});
  videoId = null; uploaded = false;
  if (localUrl) URL.revokeObjectURL(localUrl);
  localUrl = null; pendingVideo = null; encodePromise = null;
  $('vpreview').pause(); $('vpreview').removeAttribute('src'); $('vpreview').style.display = 'none';
  $('vfile-text').textContent = 'Attach video (optional, up to 1 minute)';
  $('submit').textContent = 'Submit for review';
  setVideoProgress(null);
  tell({ type: 'statik-busy', busy: false });
}
const readAsDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read file')); r.readAsDataURL(blob); });
function pickMime() {
  if (!window.MediaRecorder) return null;
  for (const c of ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4']) {
    try { if (MediaRecorder.isTypeSupported(c)) return c; } catch (e) {}
  }
  return '';
}
function loadVideoEl(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), v = document.createElement('video');
    v.preload = 'auto'; v.playsInline = true; v.setAttribute('playsinline', ''); v.src = url;
    v.onloadedmetadata = () => res({ v, url });
    v.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that video')); };
  });
}
function encodeAttempt(file, meta, scale, attempt, onProgress, noAudio) {
  return new Promise((resolve, reject) => {
    loadVideoEl(file).then((m) => {
      const v = m.v, chunks = [];
      let actx = null, finished = false, aborted = null, timer = null, watch = null, rec = null, drawTimer = null;
      // iPhones/iPads only decode video that is really in the page, so keep a tiny invisible copy attached.
      v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none';
      document.body.appendChild(v);
      const canvas = document.createElement('canvas'); canvas.width = meta.w; canvas.height = meta.h;
      const ctx = canvas.getContext('2d'), stream = canvas.captureStream(24);
      const cleanup = () => { clearTimeout(timer); clearTimeout(watch); clearInterval(drawTimer); try { if (actx) actx.close(); } catch (e) {} v.remove(); URL.revokeObjectURL(m.url); };
      if (noAudio) v.muted = true;
      else {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          actx = new AC();
          const src = actx.createMediaElementSource(v), dst = actx.createMediaStreamDestination();
          src.connect(dst);
          dst.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
          if (actx.state === 'suspended') actx.resume();
        } catch (e) { actx = null; }
      }
      const vbps = Math.max(60000, Math.min(800000, Math.floor((VIDEO_TARGET * 8 / meta.dur - 40000) * scale)));
      const mime = pickMime(), opts = { videoBitsPerSecond: vbps, audioBitsPerSecond: 32000 };
      if (mime) opts.mimeType = mime;
      try { rec = new MediaRecorder(stream, opts); } catch (e) { cleanup(); reject(new Error('BLOCKED')); return; }
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        cleanup();
        if (aborted) { reject(new Error(aborted)); return; }
        const type = (rec.mimeType || mime || 'video/webm').split(';')[0];
        const blob = new Blob(chunks, { type });
        if (!blob.size) { reject(new Error('BLOCKED')); return; }
        if (blob.size > VIDEO_MAX_BYTES) {
          if (attempt < 2) { resolve(encodeAttempt(file, meta, scale * (VIDEO_TARGET / blob.size) * 0.8, attempt + 1, onProgress, noAudio)); return; }
          reject(new Error('That clip is too detailed to fit. Try a shorter or calmer one.')); return;
        }
        resolve({ blob, mime: type, dur: meta.dur });
      };
      const stopRec = () => { try { if (rec.state !== 'inactive') rec.stop(); } catch (e) {} };
      const finish = () => { if (finished) return; finished = true; setTimeout(stopRec, 150); };
      const abort = (why) => {
        if (finished) return;
        finished = true; aborted = why;
        if (rec.state === 'inactive') { cleanup(); reject(new Error(why)); } else stopRec();
      };
      const frame = () => {
        if (finished) { clearInterval(drawTimer); return; }
        try { ctx.drawImage(v, 0, 0, meta.w, meta.h); } catch (e) {}
        onProgress(Math.min(1, v.currentTime / meta.dur), attempt);
      };
      v.onended = finish;
      v.onerror = () => abort('BLOCKED');
      timer = setTimeout(finish, (meta.dur + 10) * 1000);
      rec.start(1000);
      // If the video never starts moving (common on iPhones), give up on this method instead of sitting at 0%.
      const go = () => {
        drawTimer = setInterval(frame, 42);
        watch = setTimeout(() => { if (!finished && v.currentTime < 0.05) abort('STALL'); }, noAudio ? 5000 : 3000);
      };
      const p = v.play();
      if (p && p.then) p.then(go).catch(() => { v.muted = true; v.play().then(go).catch(() => abort('BLOCKED')); });
      else go();
    }).catch(reject);
  });
}
async function processVideo(file, onProgress) {
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) throw new Error("This browser can't compress videos. Try Chrome on a computer or Chromebook.");
  if (file.size > 400 * 1024 * 1024) throw new Error('That video file is too large');
  const m = await loadVideoEl(file), v = m.v, dur = v.duration;
  URL.revokeObjectURL(m.url);
  if (!isFinite(dur) || dur <= 0) throw new Error('Could not read that video');
  if (dur > VIDEO_MAX_SEC + 0.5) throw new Error('Videos can be up to 1 minute (this one is ' + Math.round(dur) + 's)');
  const vw = v.videoWidth || 640, vh = v.videoHeight || 360, sc = Math.min(1, 480 / Math.max(vw, vh));
  const meta = { dur, w: Math.max(2, Math.round(vw * sc / 2) * 2), h: Math.max(2, Math.round(vh * sc / 2) * 2) };
  let silent = false;
  const cb = (fr, at) => onProgress(fr, at, silent);
  try { return await encodeAttempt(file, meta, 1, 1, cb, false); }
  catch (e) { if (e.message !== 'STALL' && e.message !== 'BLOCKED') throw e; }
  silent = true; // second try: no sound capture (works on more phones)
  try { const r = await encodeAttempt(file, meta, 1, 1, cb, true); r.silent = true; return r; }
  catch (e) { if (e.message !== 'STALL' && e.message !== 'BLOCKED') throw e; }
  // last resort: a small clip can be sent as-is
  if (file.size <= VIDEO_MAX_BYTES) return { blob: file, mime: file.type === 'video/webm' ? 'video/webm' : 'video/mp4', dur, passthrough: true };
  throw new Error("This device couldn't process that video. Try a shorter clip (under about 2 MB) or post from a computer or Chromebook.");
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('The upload timed out. Check your connection and try again.')), ms))]);
async function uploadVideo(id, uid, v, cancelled) {
  const d = await readAsDataURL(v.blob), b64 = d.slice(d.indexOf(',') + 1), n = Math.ceil(b64.length / CHUNK);
  if (n > 16) throw new Error('Video is too big to store');
  const base = db.ref('submissionVideos/' + id);
  try {
    setVideoProgress('Uploading video… 0%', 0);
    await withTimeout(base.set({ owner: uid, mime: v.mime, n, dur: Math.round(v.dur) }), 30000);
    for (let k = 0; k < n; k++) {
      if (cancelled()) throw new Error('cancelled');
      await withTimeout(base.child('chunks/' + k).set(b64.slice(k * CHUNK, (k + 1) * CHUNK)), 30000);
      setVideoProgress('Uploading video… ' + Math.round(((k + 1) / n) * 100) + '%', (k + 1) / n);
    }
  } catch (e) { base.remove().catch(() => {}); throw e; }
}
// Picking a video starts everything straight away: show it, prepare it, upload it.
$('vfile').addEventListener('change', () => {
  const f = $('vfile').files[0]; $('vfile').value = '';
  if (!f) return;
  clearVideo(); imageData = null; $('preview').style.display = 'none'; $('file-text').textContent = 'Attach image (optional)';
  const my = videoToken, id = db.ref('submissions').push().key;
  videoId = id;
  localUrl = URL.createObjectURL(f);
  $('vpreview').src = localUrl; $('vpreview').style.display = 'block';
  $('vfile-text').textContent = '✓ Picked: ' + f.name;
  $('submit').textContent = 'Post (keeps going in background)';
  tell({ type: 'statik-busy', busy: true });
  setVideoProgress('Getting your video ready… 0%', 0);
  encodePromise = (async () => {
    const r = await processVideo(f, (fr, at, silent) => {
      if (my === videoToken) setVideoProgress((silent ? 'Trying again without sound… ' : at > 1 ? 'Re-compressing… ' : 'Getting your video ready… ') + Math.round(fr * 100) + '% · keep this tab open', fr);
    });
    if (my !== videoToken) throw new Error('cancelled');
    pendingVideo = r;
    const user = await ready;
    await uploadVideo(id, user.uid, r, () => my !== videoToken);
    if (my !== videoToken) throw new Error('cancelled');
    uploaded = true;
    setVideoProgress(null);
    $('submit').textContent = 'Submit for review';
    if (!bg) setStatus('✓ Video uploaded' + (r.silent ? ' (without sound: this device can\'t capture audio)' : '') + '. Add a title and press Submit.', 'ok');
    return id;
  })();
  encodePromise.catch((e) => { if (my !== videoToken || bg) return; setStatus(e.message, 'err'); clearVideo(); });
});
// If the form is closed with an uploaded-but-unposted video, try to clean it up.
window.addEventListener('pagehide', () => { if (videoId) db.ref('submissionVideos/' + videoId).remove().catch(() => {}); });

$('submit').addEventListener('click', async () => {
  const title = $('title').value.trim(), description = $('desc').value.trim();
  if (!title) return setStatus('Title is required.', 'err');
  const wait = Math.ceil((+localStorage.getItem('statik_last_submit') + COOLDOWN_MS - Date.now()) / 1000);
  if (wait > 0) return setStatus(`Please wait ${wait}s before submitting again.`, 'err');

  const withVideo = !!encodePromise;
  $('submit').disabled = true;
  setStatus('Submitting…');
  if (withVideo && !uploaded) { bg = true; lastLabel = ''; tell({ type: 'statik-background' }); } // form hides, video keeps going
  let ref = null;
  try {
    const user = await ready;
    const data = { title, description, authorUid: user.uid, createdAt: firebase.database.ServerValue.TIMESTAMP };
    if (imageData) data.imageData = imageData;
    if (withVideo) {
      const vid = await encodePromise;         // already finished if the upload completed, otherwise we wait here
      data.hasVideo = true;
      ref = db.ref('submissions/' + vid);      // same id as the video so the two stay linked
    } else ref = db.ref('submissions').push();
    await ref.set(data);
    localStorage.setItem('statik_last_submit', String(Date.now()));
    $('title').value = ''; $('desc').value = ''; $('file').value = '';
    $('title-ctr').textContent = '0/100'; $('desc-ctr').textContent = '0/1000';
    $('preview').style.display = 'none'; $('file-text').textContent = 'Attach image (optional)';
    imageData = null; clearVideo(true);
    setStatus('✅ Submitted! Your post is now waiting for admin review. This can take up to 3 days, and you don\'t need to do anything else.', 'ok');
    if (bg) tell({ type: 'statik-done' });
  } catch (err) {
    console.error(err);
    if (withVideo && !uploaded) clearVideo();   // the video itself failed, so pick it again
    const msg = err && err.code === 'PERMISSION_DENIED'
      ? 'The database rejected the upload. The latest database rules may not be published yet.'
      : (err && err.message) || 'Submission failed. Try again.';
    setStatus(msg, 'err');
    if (bg) tell({ type: 'statik-error', message: msg });
  } finally { bg = false; $('submit').disabled = false; setVideoProgress(null); }
});
</script>
</body>
</html>
