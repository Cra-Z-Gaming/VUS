<script>

const sektorPlayerUrl = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/refs/heads/main/vus-music-player.html";

b.onclick = async () => {
	const popup = window.open("about:blank");
	if (!popup) { s.textContent = "Allow popups first."; return; }
	s.textContent = "Loading...";
	try {
		let html = await (await fetch(sektorHtmlUrl)).text();

		try {
			playerHtml = await (await fetch(sektorPlayerUrl)).text();
			playerHtml = playerHtml.replace('<div class="brand-mark">VUS</div>', '<div class="brand-mark">S</div>').replace('<div class="b-name">Music Player</div>', '<div class="b-name">Sektor Audio</div>');

			playerHtml = playerHtml.replace("</head>", "<style>#main{position:relative;grid-template-columns:300px minmax(0,1fr)}#pl-panel{padding-top:54px}#sektor-library-label{top:12px;right:12px}#sektor-library-toggle:checked ~ #sektor-library-label{right:12px}</style></head>");
			playerHtml = playerHtml.replace("</head>", "<style>#sektor-library-label{display:none!important}</style></head>");
			playerHtml = playerHtml.replace("</body>", "<script>document.getElementById('sektor-library-toggle').addEventListener('change',function(){parent.postMessage({type:'sektor-library-toggle',collapsed:this.checked},'*')});<\/script></body>");
