<!doctype html><title>Sektor launcher</title><button id=b>Open Sektor</button><p id=s></p><script>u='https://raw.githubusercontent.com/REALDABEAST-VUS-ALT2/VUS/main/VUS-Servers.html';b.onclick=async()=>{w=open('about:blank');if(!w)return s.textContent='Allow popups first.';s.textContent='Loading...';try{r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);h=await r.text();base=u.slice(0,u.lastIndexOf('/')+1);[css,js]=await Promise.all([fetch(base+'other/VUS-Servers/style.css').then(x=>x.text()),fetch(base+'other/VUS-Servers/app.js').then(x=>x.text())]);h=h.replace(/<link\b[^>]*href=["']\.\/other\/VUS-Servers\/style\.css[^"']*["'][^>]*>/i,'<style>'+css+'</style>').replace(/<script\b[^>]*src=["']\.\/other\/VUS-Servers\/app\.js[^"']*["'][^>]*><\/script>/i,'<script>'+js.replace(new RegExp('<'+String.fromCharCode(47)+'script','gi'),'<'+String.fromCharCode(92,47)+'script')+'<'+String.fromCharCode(47)+'script>').replace(/<head>/i,'<head><base href="'+base+'">');w.document.write(h);w.document.close();s.textContent='Opened.'}catch(e){w.close();s.textContent='Could not load Sektor.'}}</script>
