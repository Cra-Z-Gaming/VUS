<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo Browser</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--mute:#8b949e;--accent:#2f81f7;--ok:#3fb950}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  header{height:96px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#161b22 0%,var(--bg) 100%);display:flex;align-items:center}
  .searchbar{display:grid;grid-template-columns:auto minmax(260px,1fr) auto auto;gap:9px;align-items:center;width:100%;max-width:820px;margin:0 auto}
  header h1{font-size:18px;margin:0 8px 0 0;letter-spacing:-.02em}
  input,select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 13px}
  input:focus,select:focus{outline:1px solid var(--accent)}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  #q{flex:1;min-width:220px;padding:11px 17px;background:#0d1117}
  main{padding:20px 16px;max-width:1180px;margin:0 auto;min-height:calc(100vh - 96px)}
  .hint{color:var(--mute);font-size:13px}
  .err{color:#f85149;background:#f851491a;border:1px solid #f8514966;padding:10px 12px;border-radius:6px;margin:10px 0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  .repo{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border-radius:12px}
  .repo b{color:var(--accent)}
  .repo small{color:var(--mute);display:block}
  .layout{display:grid;grid-template-columns:minmax(390px,1fr) minmax(0,1.45fr);gap:14px;align-items:stretch}
  @media(max-width:800px){header{height:auto;min-height:96px;padding:15px 16px}.searchbar{grid-template-columns:1fr auto}.searchbar h1{grid-column:1/-1}.searchbar #q{min-width:0}main{min-height:calc(100vh - 96px)}.layout{grid-template-columns:1fr}.layout>.box{height:580px}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;height:680px;overflow:auto}
  #tree{height:500px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  #tree .file,#tree .folder{padding:8px 9px;cursor:pointer;border-radius:8px;word-break:break-all;margin:2px 0}
  #tree .folder{color:var(--accent)}
  #tree .file:hover{background:#ffffff12}
  #tree .file.sel{background:#2f81f740}
  pre.preview{margin:10px 0 0;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:340px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
  iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:6px;margin-top:10px;background:var(--bg);resize:vertical}
  a{color:var(--accent);word-break:break-all}
  .name{font-size:16px;font-weight:600;word-break:break-all}
  .crumbs{margin:8px 0;color:var(--mute);word-break:break-all}
  .crumbs button{padding:2px 5px;border:0;background:transparent;color:var(--accent);border-radius:5px}
  .browser-controls{display:flex;gap:7px;align-items:center;flex-wrap:nowrap;margin-bottom:10px;min-height:40px}
  .browser-controls input{min-width:0}
  #pageNo{width:64px;text-align:center}
  .pager{display:flex;align-items:center;gap:6px;margin-top:10px;justify-content:flex-end;min-height:38px;white-space:nowrap}
  .pager button{padding:5px 10px}
</style>
</head>
<body>
<header>
  <div class="searchbar">
    <h1>Repo Browser</h1>
    <input id="q" placeholder="username  —or—  owner/repo  (or a github.com link)" autocomplete="off" spellcheck="false">
    <button class="primary" id="go">Browse</button>
    <button id="tokBtn" title="Optional token to raise the rate limit">Token</button>
  </div>
</header>
<main id="main">
  <p class="hint">Type a username to list their repos, or <code>owner/repo</code> to jump straight into one. Folders and file names load first; code is only fetched when you ask for it.</p>
</main>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var main = $('#main');
  var token = '';
  try { token = localStorage.getItem('rb_token') || ''; } catch(e){}

  var state = { owner:'', repo:'', branch:'', items:[], fileCache:{}, tree:null, currentPath:[], page:1, perPage:20, filter:'' };

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }
  function rawUrl(path){ return 'https://raw.githubusercontent.com/' + state.owner + '/' + state.repo + '/' + encodeURI(state.branch) + '/' + encPath(path); }
  function showErr(msg){ var d = document.createElement('div'); d.className='err'; d.textContent = msg; main.prepend(d); }
  function fmtSize(n){ if (n == null) return ''; if (n < 1024) return n + ' B'; if (n < 1048576) return (n/1024).toFixed(1) + ' KB'; return (n/1048576).toFixed(2) + ' MB'; }

  async function api(url){
    var h = { 'Accept':'application/vnd.github+json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    var r = await fetch(url, { headers:h });
    if (r.status === 403 || r.status === 429) {
      var reset = r.headers.get('x-ratelimit-reset');
      var when = reset ? ' Resets around ' + new Date(reset*1000).toLocaleTimeString() + '.' : '';
      throw new Error('GitHub rate limit hit (60 requests/hour without a token).' + when + ' Add a token with the Token button to raise it.');
    }
    if (r.status === 404) { var e = new Error('Not found'); e.notFound = true; throw e; }
    if (!r.ok) throw new Error('GitHub returned ' + r.status);
    return r.json();
  }

  /* ---------- input ---------- */
  function parseInput(v){
    v = v.trim().replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\.git$/,'').replace(/\/+$/,'');
    var p = v.split('/').filter(Boolean);
    if (!p.length) return null;
    if (p.length === 1) return { user:p[0] };
    var out = { owner:p[0], repo:p[1] };
    if (p[2] === 'tree' && p[3]) out.branch = p.slice(3).join('/');
    return out;
  }

  function go(){
    var t = parseInput($('#q').value);
    if (!t) return;
    main.innerHTML = '';
    if (t.user) loadUser(t.user); else openRepo(t.owner, t.repo, t.branch);
  }
  $('#go').onclick = go;
  $('#q').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
  $('#tokBtn').onclick = function(){
    var v = prompt('GitHub personal access token (optional, stored only in this browser). Leave empty to clear.', token);
    if (v === null) return;
    token = v.trim();
    try { token ? localStorage.setItem('rb_token', token) : localStorage.removeItem('rb_token'); } catch(e){}
  };

  /* ---------- repo list ---------- */
  async function loadUser(user){
    main.innerHTML = '<p class="hint">Loading repos for ' + esc(user) + '…</p>';
    try {
      var repos = [], kind = 'users';
      for (var page = 1; page <= 5; page++) {
        var chunk;
        try { chunk = await api('https://api.github.com/' + kind + '/' + encodeURIComponent(user) + '/repos?per_page=100&sort=updated&page=' + page); }
        catch(e){ if (e.notFound && kind === 'users' && page === 1) { kind = 'orgs'; page--; continue; } throw e; }
        repos = repos.concat(chunk);
        if (chunk.length < 100) break;
      }
      renderRepos(user, repos);
    } catch(e){
      main.innerHTML = '';
      showErr(e.notFound ? 'No user or organization named "' + user + '".' : e.message);
    }
  }

  function renderRepos(user, repos){
    main.innerHTML = '';
    var top = document.createElement('div');
    top.className = 'row';
    top.innerHTML = '<b>' + esc(user) + '</b><span class="hint">' + repos.length + ' repos</span>';
    var f = document.createElement('input');
    f.placeholder = 'Filter repos…'; f.style.flex = '1';
    top.appendChild(f);
    main.appendChild(top);
    var list = document.createElement('div');
    main.appendChild(list);
    function draw(){
      var q = f.value.toLowerCase();
      list.innerHTML = '';
      repos.filter(function(r){ return !q || r.name.toLowerCase().indexOf(q) > -1 || (r.description || '').toLowerCase().indexOf(q) > -1; })
        .forEach(function(r){
          var b = document.createElement('button');
          b.className = 'repo';
          b.innerHTML = '<b>' + esc(r.name) + '</b>' + (r.fork ? ' <span class="hint">fork</span>' : '') +
            '<small>' + esc(r.description || 'No description') + '</small>' +
            '<small>' + esc(r.language || '') + (r.language ? ' · ' : '') + '★ ' + r.stargazers_count + ' · updated ' + new Date(r.pushed_at || r.updated_at).toLocaleDateString() + '</small>';
          b.onclick = function(){ openRepo(r.owner.login, r.name, r.default_branch); };
          list.appendChild(b);
        });
      if (!list.children.length) list.innerHTML = '<p class="hint">No matches.</p>';
    }
    f.oninput = draw;
    draw();
  }

  /* ---------- repo tree ---------- */
  async function openRepo(owner, repo, branch){
    main.innerHTML = '<p class="hint">Loading ' + esc(owner + '/' + repo) + '…</p>';
    try {
      if (!branch) { var info = await api('https://api.github.com/repos/' + owner + '/' + repo); branch = info.default_branch; owner = info.owner.login; repo = info.name; }
      await loadTree(owner, repo, branch);
    } catch(e){
      main.innerHTML = '';
      showErr(e.notFound ? 'Repo or branch not found (private repos need a token).' : e.message);
    }
  }

  async function loadTree(owner, repo, branch){
    var data = await api('https://api.github.com/repos/' + owner + '/' + repo + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1');
    state.owner = owner; state.repo = repo; state.branch = branch;
    state.items = data.tree || [];
    state.fileCache = {};
    state.tree = buildTree(state.items);
    state.currentPath = [];
    state.page = 1;
    state.filter = '';
    selectedEl = null;
    renderRepo(!!data.truncated);
    loadBranches();
  }

  function buildTree(items){
    var root = { dirs:{}, files:[] };
    items.forEach(function(it){
      var parts = it.path.split('/');
      var node = root;
      for (var i = 0; i < parts.length - 1; i++) {
        node = node.dirs[parts[i]] || (node.dirs[parts[i]] = { dirs:{}, files:[] });
      }
      if (it.type === 'blob') node.files.push({ name:parts[parts.length-1], path:it.path, size:it.size });
      else if (it.type === 'tree') { var last = parts[parts.length-1]; node.dirs[last] = node.dirs[last] || { dirs:{}, files:[] }; }
    });
    return root;
  }

  var selectedEl = null;

  function renderRepo(truncated){
    main.innerHTML = '';
    var head = document.createElement('div');
    head.className = 'row';
    head.innerHTML = '<b>' + esc(state.owner + '/' + state.repo) + '</b>' +
      '<select id="branchSel"><option>' + esc(state.branch) + '</option></select>' +
      '<span class="hint">' + state.items.filter(function(i){return i.type==='blob';}).length + ' files</span>';
    var back = document.createElement('button');
    back.textContent = '← ' + state.owner + "'s repos";
    back.onclick = function(){ loadUser(state.owner); };
    head.appendChild(back);
    main.appendChild(head);
    $('#branchSel').onchange = async function(e){
      try { await loadTree(state.owner, state.repo, e.target.value); } catch(err){ showErr(err.message); }
    };
    if (truncated) showErr('This repo is very large; GitHub truncated the file list, so some files are missing.');

    var layout = document.createElement('div');
    layout.className = 'layout';
    layout.innerHTML = '<div class="box"><div class="browser-controls"><input id="ff" placeholder="Filter this folder…" style="flex:1"><label class="hint">Per page <select id="perPage"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option></select></label></div><div id="crumbs" class="crumbs"></div><div id="tree"></div><div id="pager" class="pager"></div></div><div class="box" id="detail"><p class="hint">Select a file to see its details.</p></div>';
    main.appendChild(layout);
    $('#ff').oninput = function(e){ state.filter = e.target.value.trim().toLowerCase(); state.page = 1; renderDirectory(); };
    $('#perPage').onchange = function(e){ state.perPage = Number(e.target.value); state.page = 1; renderDirectory(); };
    renderDirectory();
  }

  function currentNode(){
    var node = state.tree;
    state.currentPath.forEach(function(part){ node = node.dirs[part]; });
    return node;
  }

  function sortedNames(obj){ return Object.keys(obj).sort(function(a,b){ return a.toLowerCase().localeCompare(b.toLowerCase()); }); }

  function renderDirectory(){
    var treeEl = $('#tree'), crumbEl = $('#crumbs'), pager = $('#pager');
    if (!treeEl || !state.tree) return;
    var node = currentNode();
    var q = state.filter;
    var dirs = sortedNames(node.dirs).filter(function(name){ return !q || name.toLowerCase().indexOf(q) > -1; });
    var files = node.files.slice().sort(function(a,b){ return a.name.toLowerCase().localeCompare(b.name.toLowerCase()); }).filter(function(file){ return !q || file.name.toLowerCase().indexOf(q) > -1; });
    var limit = state.perPage;
    var initialDirs = Math.min(dirs.length, Math.floor(limit * 0.4));
    var initialFiles = Math.min(files.length, limit - initialDirs);
    var firstPage = dirs.slice(0, initialDirs).map(function(name){ return { folder:name }; }).concat(files.slice(0, initialFiles));
    var remaining = dirs.slice(initialDirs).map(function(name){ return { folder:name }; }).concat(files.slice(initialFiles));
    var maxPage = Math.max(1, 1 + Math.ceil(remaining.length / limit));
    state.page = Math.max(1, Math.min(state.page, maxPage));
    var entries = state.page === 1 ? firstPage : remaining.slice((state.page - 2) * limit, (state.page - 1) * limit);

    crumbEl.innerHTML = '';
    var root = document.createElement('button'); root.textContent = state.repo; root.onclick = function(){ state.currentPath = []; state.page = 1; state.filter = ''; $('#ff').value = ''; renderDirectory(); }; crumbEl.appendChild(root);
    state.currentPath.forEach(function(part, index){
      crumbEl.appendChild(document.createTextNode(' / '));
      var b = document.createElement('button'); b.textContent = part; b.onclick = function(){ state.currentPath = state.currentPath.slice(0, index + 1); state.page = 1; state.filter = ''; $('#ff').value = ''; renderDirectory(); }; crumbEl.appendChild(b);
    });
    treeEl.innerHTML = '';
    entries.forEach(function(entry){
      if (entry.folder) {
        var folder = document.createElement('div'); folder.className = 'folder'; folder.textContent = '▸ ' + entry.folder + '/';
        folder.onclick = function(){ state.currentPath.push(entry.folder); state.page = 1; state.filter = ''; $('#ff').value = ''; renderDirectory(); };
        treeEl.appendChild(folder);
      } else treeEl.appendChild(fileRow(entry));
    });
    if (!entries.length) treeEl.innerHTML = '<p class="hint">No files or folders match.</p>';
    pager.innerHTML = '';
    var prev = document.createElement('button'); prev.textContent = '← Previous'; prev.disabled = state.page === 1; prev.onclick = function(){ state.page--; renderDirectory(); };
    var label = document.createElement('span'); label.className = 'hint'; label.textContent = 'Page';
    var pageNo = document.createElement('input'); pageNo.id = 'pageNo'; pageNo.type = 'number'; pageNo.min = 1; pageNo.max = maxPage; pageNo.value = state.page;
    pageNo.onchange = function(){ state.page = Number(pageNo.value) || 1; renderDirectory(); };
    var max = document.createElement('span'); max.className = 'hint'; max.textContent = 'of ' + maxPage;
    var next = document.createElement('button'); next.textContent = 'Next →'; next.disabled = state.page === maxPage; next.onclick = function(){ state.page++; renderDirectory(); };
    pager.appendChild(prev); pager.appendChild(label); pager.appendChild(pageNo); pager.appendChild(max); pager.appendChild(next);
  }

  function fileRow(f){
    var el = document.createElement('div');
    el.className = 'file';
    el.textContent = f.name;
    el.onclick = function(){
      if (selectedEl) selectedEl.classList.remove('sel');
      selectedEl = el; el.classList.add('sel');
      showFile(f);
    };
    return el;
  }

  async function loadBranches(){
    try {
      var b = await api('https://api.github.com/repos/' + state.owner + '/' + state.repo + '/branches?per_page=100');
      var sel = $('#branchSel');
      if (!sel) return;
      sel.innerHTML = '';
      b.forEach(function(x){ var o = document.createElement('option'); o.textContent = x.name; o.value = x.name; if (x.name === state.branch) o.selected = true; sel.appendChild(o); });
    } catch(e){ /* branch list is optional */ }
  }

  /* ---------- file panel ---------- */
  var BINARY_EXT = /\.(png|jpe?g|gif|webp|ico|bmp|pdf|zip|gz|tar|7z|rar|mp3|mp4|mov|wav|ogg|woff2?|ttf|otf|eot|exe|dll|so|bin|class|jar)$/i;

  function showFile(f){
    var url = rawUrl(f.path);
    var d = $('#detail');
    d.innerHTML = '';
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = f.path.split('/').pop();
    d.appendChild(name);

    var meta = document.createElement('p');
    meta.className = 'hint';
    meta.style.margin = '4px 0';
    meta.textContent = f.path + (f.size != null ? '  ·  ' + fmtSize(f.size) : '');
    d.appendChild(meta);

    var linkP = document.createElement('p');
    linkP.style.margin = '6px 0';
    var a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = url;
    linkP.appendChild(a);
    d.appendChild(linkP);

    var row = document.createElement('div');
    row.className = 'row';
    var dl = document.createElement('button'); dl.textContent = 'Download';
    var load = document.createElement('button'); load.className = 'primary'; load.textContent = 'Load code';
    row.appendChild(dl); row.appendChild(load);
    d.appendChild(row);

    var out = document.createElement('div');
    d.appendChild(out);

    dl.onclick = async function(){
      dl.disabled = true; dl.textContent = 'Downloading…';
      try {
        var r = await fetch(url);
        if (!r.ok) throw new Error('Download failed (' + r.status + ')');
        var blob = await r.blob();
        var u = URL.createObjectURL(blob);
        var l = document.createElement('a');
        l.href = u; l.download = f.path.split('/').pop();
        document.body.appendChild(l); l.click(); l.remove();
        setTimeout(function(){ URL.revokeObjectURL(u); }, 5000);
      } catch(e){ out.innerHTML = ''; var er = document.createElement('div'); er.className = 'err'; er.textContent = e.message; out.appendChild(er); }
      dl.disabled = false; dl.textContent = 'Download';
    };

    load.onclick = async function(){
      if (BINARY_EXT.test(f.path)) { out.innerHTML = '<p class="hint">This looks like a binary file, so there is no code to show. Use the raw link or Download.</p>'; return; }
      if (f.size > 1500000 && !confirm('This file is ' + fmtSize(f.size) + '. Load it anyway?')) return;
      load.disabled = true; load.textContent = 'Loading…';
      try {
        var text = state.fileCache[url];
        if (text == null) {
          var r = await fetch(url);
          if (!r.ok) throw new Error('Could not load file (' + r.status + ')');
          text = await r.text();
          state.fileCache[url] = text;
        }
        if (text.indexOf('\u0000') > -1) { out.innerHTML = '<p class="hint">This file is binary, so there is no code to show.</p>'; }
        else renderCode(out, text);
        load.textContent = 'Loaded';
      } catch(e){
        out.innerHTML = ''; var er = document.createElement('div'); er.className = 'err'; er.textContent = e.message; out.appendChild(er);
        load.disabled = false; load.textContent = 'Load code';
      }
    };
  }

  function renderCode(out, text){
    out.innerHTML = '';
    var lines = text.split('\n');
    var LIMIT = 25;
    var bar = document.createElement('div');
    bar.className = 'row';
    var info = document.createElement('span');
    info.className = 'hint';
    info.textContent = lines.length + ' lines' + (lines.length > LIMIT ? ' · showing first ' + LIMIT : '');
    var copy = document.createElement('button'); copy.textContent = 'Copy code';
    bar.appendChild(info); bar.appendChild(copy);
    var full = null;
    if (lines.length > LIMIT) { full = document.createElement('button'); full.textContent = 'Show full code'; bar.appendChild(full); }
    out.appendChild(bar);

    var pre = document.createElement('pre');
    pre.className = 'preview';
    pre.textContent = lines.slice(0, LIMIT).join('\n');
    out.appendChild(pre);

    var frame = null;
    if (full) full.onclick = function(){
      if (frame) { frame.remove(); frame = null; pre.style.display = ''; full.textContent = 'Show full code'; return; }
      frame = document.createElement('iframe');
      frame.setAttribute('sandbox', '');
      frame.srcdoc = '<!DOCTYPE html><meta charset="utf-8"><style>html,body{margin:0;background:#0d1117;color:#e6edf3}pre{margin:0;padding:12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:4}</style><pre>' + esc(text) + '</pre>';
      out.appendChild(frame);
      pre.style.display = 'none';
      full.textContent = 'Hide full code';
    };

    copy.onclick = async function(){
      try { await navigator.clipboard.writeText(text); }
      catch(e){
        var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      copy.textContent = 'Copied ✓';
      setTimeout(function(){ copy.textContent = 'Copy code'; }, 1500);
    };
  }
})();
</script>
</body>
</html>
