.mu{color:var(--mu)}.err{color:#f85149;background:#f851491a;border:1px solid #f8514966;padding:12px 16px;border-radius:6px;margin:16px 0}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:16px 0 0}
.tabs a{color:var(--fg);padding:8px 12px;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.tabs a:hover{background:var(--hov);border-radius:6px;text-decoration:none}

.main{flex:1;min-width:0}.side{width:296px;flex:none}

.box{border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:16px}

.ro:first-child{border-top:0}.ro:hover{background:var(--hov)}
.ro .n{width:30%;min-width:140px;display:flex;gap:12px;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro .n a{color:var(--fg)}.ro .m{flex:1;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ro .t{color:var(--mu);width:110px;text-align:right}
.dir{color:var(--dir)}.file{color:var(--mu)}

details{position:relative}summary{list-style:none}summary::-webkit-details-marker{display:none}
.pop{position:absolute;z-index:20;top:34px;left:0;width:300px;background:var(--sub);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px #01040955;padding:8px;max-height:360px;overflow:auto}
.pop.r{left:auto;right:0}.pop a{display:block;padding:5px 8px;border-radius:6px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop a:hover{background:var(--hov);text-decoration:none}.pop a.on{font-weight:600}.pop .in{width:100%;margin-bottom:6px}
.side h3{font-size:16px;font-weight:600;margin:0 0 8px}.side .sec{padding:16px 0;border-bottom:1px solid var(--bd)}.side .sec:first-child{padding-top:0}

.lg{display:inline-block;margin:0 12px 4px 0;font-size:12px}

.code td{padding:0 10px;vertical-align:top}.code .ln{width:1%;min-width:50px;text-align:right;color:var(--mu);cursor:pointer;user-select:none;white-space:nowrap}.code .ln:hover{color:var(--fg)}

.scr{overflow:auto}

    $('#cb').onclick=function(e){var n=e.target.dataset&&e.target.dataset.n;if(!n)return;n=+n;if(e.shiftKey&&a){var s=Math.min(a,n);b=Math.max(a,n);a=s}else a=b=n;
     document.querySelectorAll('#cb tr.hl').forEach(function(r){r.classList.remove('hl')});for(var i=a;i<=b;i++){var r=$('#LC'+i);if(r)r.classList.add('hl')}
     cur=cur.replace(/#L[\d-L]+$/,'')+'#L'+a+(b>a?'-L'+b:'')};
   };
   showCode();ld.textContent='Loaded';
   if(isMd){var vp=$('#vp'),vc=$('#vc');vc.disabled=true;vp.disabled=false;vc.onclick=function(){vc.disabled=true;vp.disabled=false;showCode()};
    vp.onclick=async function(){vp.disabled=true;vc.disabled=false;fb.innerHTML='<div class="md mu">Rendering…</div>';try{var h=await api('/repos/'+R.info.full_name+'/contents/'+encodeURI(path)+'?ref='+encodeURIComponent(ref),'application/vnd.github.html+json');var d=path.indexOf('/')<0?'':path.slice(0,path.lastIndexOf('/'));fb.innerHTML='<div class="md">'+clean(h,R,ref,d,T)+'</div>';wireMd($('.md',fb))}catch(e){oops(e.message)}}}
  }catch(e){oops(e.message);ld.disabled=false;ld.textContent='Load'}
 };
 if(ln&&!isBin)ld.onclick();
}
/* ---------- commits ---------- */
async function commitsView(R,ref,path,T,tk){
 app.innerHTML=shell(R,ref,'<p class="mu" style="padding:16px 0">Loading commits…</p>','code');
 try{
  var c=await api('/repos/'+R.info.full_name+'/commits?sha='+encodeURIComponent(ref)+'&per_page=30&page='+cpage+(path?'&path='+encodeURIComponent(path):''));if(tk!=rt)return;
  var day='',h='';c.forEach(function(x){var d=new Date(x.commit.author.date).toDateString();if(d!=day){day=d;h+='<div class="bh" style="border-top:1px solid var(--bd)"><span class="mu">Commits on '+d.slice(4)+'</span></div>'}
   var a=x.author;h+='<div class="ro">'+(a?'<img class="av" src="'+esc(a.avatar_url)+'&s=40" alt="">':'')+'<div style="flex:1;min-width:0"><a style="color:var(--fg);font-weight:600" href="'+esc(x.html_url)+'" target="_blank" rel="noopener">'+esc(x.commit.message.split('\n')[0])+'</a><div class="mu" style="font-size:12px">'+esc(x.commit.author.name)+' committed '+ago(x.commit.author.date)+'</div></div><span class="mu" style="font-family:ui-monospace,monospace">'+x.sha.slice(0,7)+'</span><a class="btn" href="'+lnk(R,path?'blob':'tree',x.sha,path)+'" title="Browse the repository at this commit">'+ic('dir')+'</a></div>'});
  app.innerHTML=shell(R,ref,'<div style="margin:16px 0 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+branchMenu(R,ref,path,T)+'<h2 style="margin:0;font-size:20px">Commits</h2>'+(path?'<span class="mu">for</span>'+crumbs(R,ref,path,1):'')+'</div><div class="box">'+(h||'<div class="ro mu">No commits found.</div>')+'</div><div class="pg"><button id="np"'+(cpage==1?' disabled':'')+'>Newer</button><button id="op"'+(c.length<30?' disabled':'')+'>Older</button></div>','code');wireMenus();
  $('#np').onclick=function(){cpage--;commitsView(R,ref,path,T,rt)};$('#op').onclick=function(){cpage++;commitsView(R,ref,path,T,rt)};
 }catch(e){if(tk==rt)fail(e)}
}
cpage=1;route();
})();
</script>
