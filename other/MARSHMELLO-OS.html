<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MARSHMELLO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one framed "screen" inside the page. Desktop surface with icons and floating windows, taskbar along the bottom, start menu above it. */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --page:#c9d1dc; --panel:rgba(248,250,253,.82); --panel-solid:#f6f8fb; --win:#fbfcfd; --win-bar:#eaeef4;
  --fg:#18202e; --muted:#5a6578; --line:#d5dbe5; --hover:rgba(24,32,46,.07); --sel:rgba(47,109,246,.14);
  --accent:#2f6df6; --accent-fg:#ffffff; --term-bg:#0f141c; --term-fg:#d6dfec; --bad:#d6453d; --ok:#1f9d63;
  --shadow:0 18px 44px rgba(10,18,36,.32),0 2px 6px rgba(10,18,36,.18);
  --wall-tide:radial-gradient(120% 90% at 85% 10%,rgba(160,215,200,.55),transparent 60%),linear-gradient(135deg,#1c3556 0%,#2c6486 50%,#5fa595 100%);
  --wall-dusk:radial-gradient(110% 90% at 15% 0%,rgba(240,170,110,.5),transparent 60%),linear-gradient(140deg,#281f4b 0%,#7a3a69 55%,#d98a58 100%);
  --wall-moss:radial-gradient(100% 80% at 90% 0%,rgba(190,205,150,.4),transparent 60%),linear-gradient(135deg,#17241e 0%,#35523f 55%,#8da57a 100%);
  --wall-slate:linear-gradient(135deg,#1c2028 0%,#38414f 55%,#69758a 100%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#080b11; --panel:rgba(21,26,35,.82); --panel-solid:#171c26; --win:#1a202b; --win-bar:#232a38;
  --fg:#e5eaf2; --muted:#93a0b4; --line:#2d3545; --hover:rgba(229,234,242,.08); --sel:rgba(120,160,255,.2);
  --shadow:0 18px 44px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#080b11; --panel:rgba(21,26,35,.82); --panel-solid:#171c26; --win:#1a202b; --win-bar:#232a38;
  --fg:#e5eaf2; --muted:#93a0b4; --line:#2d3545; --hover:rgba(229,234,242,.08); --sel:rgba(120,160,255,.2);
  --shadow:0 18px 44px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;display:flex;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#screen{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:14px;
  border:1px solid var(--line);background:var(--wall-tide)}
#screen[data-wall="tide"]{background:var(--wall-tide)}
#screen[data-wall="dusk"]{background:var(--wall-dusk)}
#screen[data-wall="moss"]{background:var(--wall-moss)}
#screen[data-wall="slate"]{background:var(--wall-slate)}
#desk{flex:1;min-height:0;position:relative;overflow:hidden}

#mark{position:absolute;right:24px;bottom:18px;z-index:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);pointer-events:none;user-select:none}
#mark b{font-size:34px;font-weight:600;letter-spacing:.02em;opacity:.7}
#mark span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
@media (max-width:560px){#mark b{font-size:24px}}
#icons{position:absolute;inset:0;z-index:1;padding:12px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.dicon{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1px solid transparent;border-radius:10px;
  background:none;color:#fff;cursor:pointer;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dicon .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px)}
.dicon:hover{background:rgba(255,255,255,.1)}
.dicon.on{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}

.win{position:absolute;display:flex;flex-direction:column;min-width:260px;min-height:160px;background:var(--win);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.win:not(.focus) .tb{opacity:.72}
.win.min{display:none}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0;border:0}
.tb{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;background:var(--win-bar);border-bottom:1px solid var(--line);user-select:none;touch-action:none}
.ti{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:13px}
.ti b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ctl{display:flex;gap:2px}
.ctl button{width:30px;height:26px;border:0;background:none;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.ctl button:hover{background:var(--hover)}
.ctl .x:hover{background:var(--bad);color:#fff}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 52%,var(--muted) 52% 58%,transparent 58% 70%,var(--muted) 70% 76%,transparent 76%);opacity:.6}
.win.max .rs{display:none}

#bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);position:relative;z-index:5000}
#start{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
#tasks{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.task{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;white-space:nowrap;max-width:190px;flex:none}
.task span{overflow:hidden;text-overflow:ellipsis}
.task:hover{background:var(--hover)}
.task.on{background:var(--sel);border-color:var(--accent)}
.task.min{opacity:.6}
#clock{font-size:12px;line-height:1.3;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
#clock b{display:block;color:var(--fg);font-weight:600;font-size:13px}

#menu{position:absolute;left:10px;bottom:60px;z-index:6000;width:min(330px,calc(100% - 20px));max-height:calc(100% - 80px);display:flex;flex-direction:column;gap:10px;padding:12px;
  background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
#menu input{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--win)}
#menu .list{display:flex;flex-direction:column;gap:2px;overflow:auto}
#menu .item{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
#menu .item:hover,#menu .item:focus-visible{background:var(--hover)}
#menu .foot{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}

.btn{height:28px;padding:0 10px;border:1px solid var(--line);background:var(--win);border-radius:6px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}

/* Files */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.fbar .path{flex:1;min-width:90px;font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.addrow input{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--win)}
.fmain{flex:1;min-height:0;display:flex}
.places{width:128px;flex:none;display:flex;flex-direction:column;gap:2px;padding:8px;border-right:1px solid var(--line);background:var(--win-bar)}
.places button{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:12.5px;cursor:pointer;text-align:left}
.places button:hover{background:var(--hover)}
.flist{flex:1;min-width:0;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:1px}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:10px;height:32px;padding:0 8px;border:0;border-radius:6px;background:none;text-align:left;cursor:default;font-size:13px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sz{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.empty{margin:20px;color:var(--muted);text-align:center}
.fstat{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.fstat.bad,.nstat.bad{color:var(--bad)}
@media (max-width:560px){.places{display:none}}

/* Terminal */
.term{flex:1;min-height:0;overflow:auto;padding:10px 12px;background:var(--term-bg);color:var(--term-fg);font-family:var(--mono);font-size:12.5px;line-height:1.5}
.term .out>div{white-space:pre-wrap;word-break:break-word}
.term .ps{color:#7fd1a8}
.term .d{color:#7ab4ff}
.term .err{color:#ff8f86}
.term .m{color:#8795ab}
.term .in{display:flex;gap:8px}
.term .in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:inherit;padding:0}

/* Notes */
.nbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.nbar input{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--win);font-family:var(--mono);font-size:12px}
.body textarea{flex:1;min-height:0;border:0;outline:0;resize:none;padding:12px;background:var(--win);font-family:var(--mono);font-size:13px;line-height:1.55}
.nstat{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* Calculator */
.calc{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px;outline:0}
.cdisp{padding:8px 10px;border-radius:8px;background:var(--win-bar);text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end}
.cdisp small{color:var(--muted);font-size:12px;min-height:16px;font-variant-numeric:tabular-nums}
.cdisp output{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.ckeys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ckeys button{border:1px solid var(--line);border-radius:8px;background:var(--win);font-size:17px;cursor:pointer;min-height:40px}
.ckeys button:hover{background:var(--hover)}
.ckeys .op{background:var(--sel)}
.ckeys .eq{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.ckeys .z{grid-column:span 2}

/* Sketch */
.ptools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.ptools .sw{display:flex;gap:6px}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.ptools label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.pwrap{flex:1;min-height:0;overflow:auto;padding:10px;background:var(--win-bar)}
.pwrap canvas{display:block;width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:crosshair;touch-action:none}

/* Activity */
.act{padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.act table{width:100%;border-collapse:collapse;font-size:13px}
.act th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.act th,.act td{padding:6px 4px;border-bottom:1px solid var(--line)}
.act td:last-child{text-align:right}

/* Settings */
.set{padding:14px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.set h3{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.set p{margin:0 0 8px;color:var(--muted);line-height:1.5;max-width:60ch}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.set .sw{display:flex;gap:10px;flex-wrap:wrap}
.set .sw button{width:32px;height:32px}
.set .sw.wall button{width:56px;height:34px;border-radius:8px}

/* Chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:13.5px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.mrow{align-self:flex-end;max-width:88%;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.mrow .msg{max-width:100%}
.mt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cname{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.cname input{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--win);color:var(--fg)}
.chat .hint{margin:auto;text-align:center;color:var(--muted);max-width:32ch;line-height:1.55}
.cin{display:flex;align-items:flex-end;gap:6px;padding:8px;border-top:1px solid var(--line)}
.body .cin textarea{flex:1;min-width:0;min-height:0;height:52px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--font);font-size:13.5px;line-height:1.4;background:var(--win)}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 8px}
.cnote{font-size:11.5px;color:var(--muted)}

/* Calendar */
.cal{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.chead{display:flex;align-items:center;gap:6px;padding:8px}
.chead b{flex:1;text-align:center;font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:0 8px}
.cgrid .wd{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.cgrid .d{height:44px;border:1px solid transparent;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-variant-numeric:tabular-nums}
.cgrid .d:hover{background:var(--hover)}
.cgrid .d.sel{background:var(--sel);border-color:var(--accent)}
.cgrid .d span{width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cgrid .d.today span{background:var(--accent);color:var(--accent-fg)}
.cgrid .d i{display:flex;gap:2px;height:5px}
.cgrid .d em{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cday{margin-top:8px;padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cday h4{margin:0;font-size:13px}
.cday ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.cday li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.cday li.none{border:0;padding:0;color:var(--muted)}
.cday .tm{min-width:64px;color:var(--muted);font-variant-numeric:tabular-nums}
.cday .ttl{flex:1;min-width:0;overflow-wrap:anywhere}
.cadd{display:flex;flex-wrap:wrap;gap:6px}
.cadd input{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--win)}
.cadd .tt{flex:1;min-width:120px}

/* Weather */
.wx{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding-bottom:12px}
.wnow{margin:12px;padding:18px 20px 14px;border-radius:16px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.22);
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;
  background:linear-gradient(135deg,#5b7fb0,#8da8cf);box-shadow:0 6px 18px rgba(20,30,60,.22)}
.wnow[data-k="sun"]{background:linear-gradient(135deg,#f6a93b,#ee6a4c)}
.wnow[data-k="night"]{background:linear-gradient(135deg,#141b3a,#3b4283)}
.wnow[data-k="partly"]{background:linear-gradient(135deg,#4f9fe0,#e9ad5a)}
.wnow[data-k="cloud"]{background:linear-gradient(135deg,#67788d,#9aa8ba)}
.wnow[data-k="rain"]{background:linear-gradient(135deg,#2f4c69,#587f9f)}
.wnow[data-k=""]{background:var(--win-bar);color:var(--muted);text-shadow:none;box-shadow:none;border:1px dashed var(--line);grid-template-columns:auto minmax(0,1fr);padding:18px}
.wl{display:flex;flex-direction:column;min-width:0}
.wplace{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbig{font-size:64px;font-weight:500;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wdesc{font-size:16px;font-weight:500}
.whl{font-size:13px;opacity:.92;margin-top:2px;font-variant-numeric:tabular-nums}
.wico{display:grid;place-items:center;flex:none}
.wico.hero{color:#fff;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.wico.empty{color:var(--muted)}
.wfoot{grid-column:1 / -1;font-size:12px;opacity:.9}
.wempty{margin:0;line-height:1.5}
.wnote{margin:0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--win-bar);font-size:12.5px;color:var(--muted);line-height:1.45}
.wlabel{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.whead{margin:12px 16px 6px}
.wdays{list-style:none;margin:0 12px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--win);overflow:hidden}
.wdays li{display:grid;grid-template-columns:minmax(64px,92px) 24px 34px 30px minmax(30px,1fr) 30px;align-items:center;gap:8px;padding:9px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.wdays li+li{border-top:1px solid var(--line)}
.wdays .wico{color:var(--accent)}
.wdays .dn{font-weight:500}
.wdays .dp{color:var(--accent);font-size:12px}
.wdays .dl{color:var(--muted);text-align:right}
.wdays .dh{text-align:right;font-weight:600}
.dbar{position:relative;height:6px;border-radius:3px;background:var(--win-bar)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#4f9fe0,#f0a84a)}
.wsearch{display:flex;gap:6px;padding:12px 12px 0}
.wsearch input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--win)}
.wsearch .btn{height:32px}
.wres{margin:8px 12px 0;border:1px solid var(--line);border-radius:10px;background:var(--win);overflow:hidden}
.wopt{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;cursor:pointer;font-size:13px}
.wopt+.wopt{border-top:1px solid var(--line)}
.wopt:hover,.wopt:focus-visible{background:var(--hover)}
.wmsg{margin:8px 12px 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.wmsg.bad{color:var(--bad)}
.wnow[data-k="snow"]{background:linear-gradient(135deg,#5f88b4,#a9c3de)}
.wnow[data-k="fog"]{background:linear-gradient(135deg,#6c7886,#9ca7b4)}
.wnow[data-k="storm"]{background:linear-gradient(135deg,#262a40,#5a4b86)}

.wfine{margin:10px 16px 0;font-size:11.5px;color:var(--muted);line-height:1.45}

/* Games */
.gm{flex:1;min-height:0;display:flex;flex-direction:column}
.gtabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--win-bar)}
.gtab{height:28px;padding:0 12px;border:0;border-radius:6px;background:none;cursor:pointer;font-size:13px}
.gtab:hover{background:var(--hover)}
.gtab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.gbody{flex:1;min-height:0;overflow:auto;display:flex}
.gcol{margin:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.gscore{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.gscore b{color:var(--fg);font-variant-numeric:tabular-nums}
.gmsg{margin:0;min-height:20px;font-size:13px;color:var(--muted)}
.sw{position:relative;width:360px;max-width:100%;border-radius:10px;overflow:hidden;outline-offset:2px;line-height:0}
.sw canvas{width:100%;height:auto;display:block}
.sov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(10,14,22,.72);color:#fff;text-align:center;padding:16px;line-height:1.4}
.sov[hidden]{display:none}
.sov b{font-size:22px}.sov span{font-size:13px;opacity:.85}
.gpad{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.gpad button{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--win);cursor:pointer;font-size:14px}
.gpad button:hover{background:var(--hover)}
.gpad .go{font-size:12.5px;background:var(--accent);color:var(--accent-fg);border-color:transparent}
.tgrid{display:grid;grid-template-columns:repeat(3,84px);gap:6px}
.tc{width:84px;height:84px;border:1px solid var(--line);border-radius:12px;background:var(--win);font-size:40px;font-weight:600;cursor:pointer}
.tc:hover:not(:disabled){background:var(--hover)}
.tc:disabled{cursor:default;color:var(--fg)}
.tc[data-p="X"]{color:var(--accent)}
.tc[data-p="O"]{color:#e0804a}
.mgrid{display:grid;grid-template-columns:repeat(4,64px);gap:8px}
.mc{position:relative;width:64px;height:64px;border:1px solid var(--line);border-radius:12px;background:var(--win-bar);cursor:pointer;padding:0;font-size:28px}
.mc .mf,.mc .mb{position:absolute;inset:0;display:grid;place-items:center}
.mc .mb{color:var(--muted);font-size:20px}
.mc .mf{opacity:0}
.mc.up,.mc.ok{background:var(--win);cursor:default}
.mc.up .mf,.mc.ok .mf{opacity:1}
.mc.up .mb,.mc.ok .mb{opacity:0}
.mc.ok{border-color:var(--ok);color:var(--ok)}
@media (max-width:420px){.mgrid{grid-template-columns:repeat(4,56px)}.mc{width:56px;height:56px}.tgrid{grid-template-columns:repeat(3,72px)}.tc{width:72px;height:72px}}

@media (prefers-reduced-motion:reduce){.win{animation:none}}
@media (max-width:560px){.task span{display:none}.task{padding:0 10px}}
</style>

<div id="screen" data-wall="tide">
  <div id="desk"><div id="mark" aria-hidden="true"><b>MARSHMELLO</b><span>Version 1.0</span></div><div id="icons"></div></div>
  <div id="menu" hidden></div>
  <div id="bar">
    <button id="start" aria-haspopup="true" aria-expanded="false"></button>
    <div id="tasks"></div>
    <div id="clock" aria-live="off"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t0=Date.now();
const coarse=matchMedia('(pointer:coarse)').matches;

/* icons */
const P={
 files:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 file:'<path d="M7 3h7l5 5v13H7zM14 3v5h5"/>',
 term:'<path d="M4 6l6 6-6 6M12 18h8"/>',
 notes:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h1M12 12h1M16 12h0M8 16h1M12 16h1M16 16h0"/>',
 paint:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2s0-2 1.5-2h2a3 3 0 0 0 3-3c0-6-4-11-8-11z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="11" r="1"/>',
 tasks:'<path d="M6 20v-8M12 20V6M18 20v-5M3 20h18"/>',
 game:'<rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 10.5v4M6 12.5h4M15.5 11.5h.01M17.5 13.5h.01"/>',
 wx:'<path d="M6.5 18a4 4 0 0 1-.4-7.98 5.5 5.5 0 0 1 10.6-1.2A4.2 4.2 0 0 1 17.5 18z"/>',
 w_moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
 w_sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>',
 w_partly:'<circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M2 8h1.5M3.8 3.8l1 1M12.2 3.8l-1 1"/><path d="M9 19a3.5 3.5 0 0 1-.3-7 4.8 4.8 0 0 1 9.2 1A3.5 3.5 0 0 1 17.5 19z"/>',
 w_cloud:'<path d="M6.5 18a4 4 0 0 1-.4-7.98 5.5 5.5 0 0 1 10.6-1.2A4.2 4.2 0 0 1 17.5 18z"/>',
 w_rain:'<path d="M6.5 15a4 4 0 0 1-.4-7.98 5.5 5.5 0 0 1 10.6-1.2A4.2 4.2 0 0 1 17.5 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
 w_storm:'<path d="M6.5 15a4 4 0 0 1-.4-7.98 5.5 5.5 0 0 1 10.6-1.2A4.2 4.2 0 0 1 17.5 15z"/><path d="M12.5 15l-2.5 3h3l-2.5 3"/>',
 w_snow:'<path d="M6.5 15a4 4 0 0 1-.4-7.98 5.5 5.5 0 0 1 10.6-1.2A4.2 4.2 0 0 1 17.5 15z"/><path d="M8 19h.01M12 21h.01M16 19h.01M10 20h.01M14 18h.01"/>',
 w_wind:'<path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h8"/>',
 w_fog:'<path d="M4 8h16M6 12h12M4 16h16M7 20h10"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
 set:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
 min:'<path d="M6 12h12"/>', max:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>',
 up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
 logo:'<circle cx="12" cy="12" r="8"/><path d="M4.5 13c3-4 6 4 9 0s4-3 6-1"/>'
};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* preferences */
let prefs={theme:'auto',accent:'#2f6df6',wall:'tide'};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('halcyon.prefs')||'{}'))}catch(e){}
const applyPrefs=initial=>{
  const r=document.documentElement;
  if(prefs.theme==='auto'){if(!initial)r.removeAttribute('data-theme')}else r.setAttribute('data-theme',prefs.theme);
  r.style.setProperty('--accent',prefs.accent);
  $('#screen').dataset.wall=prefs.wall;
};
const savePrefs=()=>{try{localStorage.setItem('halcyon.prefs',JSON.stringify(prefs))}catch(e){}};

/* virtual file system */
const defaultFS=()=>({t:'d',c:{
  home:{t:'d',c:{user:{t:'d',c:{
    Documents:{t:'d',c:{
      'welcome.txt':{t:'f',c:'Welcome to MARSHMELLO.\n\nThis is a small desktop that runs entirely in your browser.\n\n- Drag windows by their title bars, resize from the corner.\n- Double-click a desktop icon, or use the MARSHMELLO menu, to open an app.\n- Files you create are kept in this browser\'s storage.\n- Try the Terminal: type "help" to see what it can do.\n'},
      'shopping.txt':{t:'f',c:'oat milk\nlemons\nbatteries (AA)\ndish soap\n'},
      'ideas.txt':{t:'f',c:'1. A tiny weather app for the desktop\n2. File search in Terminal (grep)\n3. Window snapping\n'}
    }},
    Desktop:{t:'d',c:{}},
    Pictures:{t:'d',c:{}},
    'todo.md':{t:'f',c:'# To do\n\n- [x] Boot the system\n- [ ] Explore the file manager\n- [ ] Write a note\n'}
  }}}},
  etc:{t:'d',c:{'os-release':{t:'f',c:'NAME="MARSHMELLO"\nVERSION="1.0"\nID=marshmello\n'}}}
}});
let FS=null;
try{FS=JSON.parse(localStorage.getItem('halcyon.fs'))}catch(e){}
if(!FS||FS.t!=='d'||!FS.c)FS=defaultFS();
const bus=new EventTarget();
const changed=()=>{try{localStorage.setItem('halcyon.fs',JSON.stringify(FS))}catch(e){} bus.dispatchEvent(new Event('fs'))};
const norm=(p,cwd='/')=>{
  if(p==='~'||p.startsWith('~/'))p='/home/user'+p.slice(1);
  const parts=(p.startsWith('/')?p:cwd+'/'+p).split('/'),o=[];
  for(const s of parts){if(!s||s==='.')continue;if(s==='..')o.pop();else o.push(s)}
  return o;
};
const get=parts=>{let n=FS;for(const s of parts){if(n.t!=='d'||!Object.prototype.hasOwnProperty.call(n.c,s))return null;n=n.c[s]}return n};
const toPath=a=>'/'+a.join('/');
const mk=(parts,type,content='')=>{
  const par=get(parts.slice(0,-1)),nm=parts[parts.length-1];
  if(!par||par.t!=='d')return 'No such directory';
  if(!nm)return 'Invalid name';
  if(nm in par.c)return `"${nm}" already exists`;
  par.c[nm]=type==='d'?{t:'d',c:{}}:{t:'f',c:content};changed();return null;
};
const rmNode=parts=>{
  if(!parts.length)return 'Cannot remove the root folder';
  const par=get(parts.slice(0,-1)),nm=parts[parts.length-1];
  if(!par||!(nm in par.c))return 'No such file or directory';
  delete par.c[nm];changed();return null;
};
const writeFile=(parts,content)=>{
  const par=get(parts.slice(0,-1)),nm=parts[parts.length-1];
  if(!par||par.t!=='d')return 'That folder does not exist';
  if(!nm)return 'Enter a file name';
  if(par.c[nm]&&par.c[nm].t==='d')return 'That path is a folder';
  par.c[nm]={t:'f',c:content};changed();return null;
};
const size=n=>n<1024?n+' B':(n/1024).toFixed(1)+' KB';
const countFiles=n=>n.t==='f'?1:Object.values(n.c).reduce((a,v)=>a+countFiles(v),0);

/* window manager */
let zTop=10,wid=0,focused=null;
const wins=new Map();
const desk=$('#desk'),tasks=$('#tasks');
const APPS={
  files:{title:'Files',icon:'files',w:580,h:380,mount:mountFiles},
  terminal:{title:'Terminal',icon:'term',w:540,h:340,mount:mountTerm},
  chat:{title:'Chat',icon:'chat',w:420,h:470,mount:mountChat},
  calendar:{title:'Calendar',icon:'cal',w:500,h:500,mount:mountCalendar},
  weather:{title:'Weather',icon:'wx',w:440,h:600,mount:mountWeather},
  games:{title:'Games',icon:'game',w:440,h:520,mount:mountGames},
  notes:{title:'Notes',icon:'notes',w:480,h:360,mount:mountNotes},
  calc:{title:'Calculator',icon:'calc',w:260,h:400,mount:mountCalc},
  paint:{title:'Sketch',icon:'paint',w:560,h:430,mount:mountPaint},
  activity:{title:'Activity',icon:'tasks',w:440,h:340,mount:mountActivity},
  settings:{title:'Settings',icon:'set',w:450,h:430,mount:mountSettings}
};

function openApp(id,o={}){
  const a=APPS[id];if(!a)return null;
  const W=desk.clientWidth,H=desk.clientHeight,small=W<640;
  const node=el('section','win');
  node.setAttribute('role','dialog');node.setAttribute('aria-label',a.title);
  node.innerHTML=`<header class="tb"><span class="ti">${ic(a.icon,16)}<b></b></span><span class="ctl"><button type="button" data-a="min" aria-label="Minimize">${ic('min',14)}</button><button type="button" data-a="max" aria-label="Maximize">${ic('max',14)}</button><button type="button" class="x" data-a="close" aria-label="Close">${ic('close',14)}</button></span></header><div class="body"></div><i class="rs"></i>`;
  const width=Math.min(a.w,W-16),height=Math.min(a.h,H-16),n=wins.size%7;
  const left=o.x!=null?o.x:Math.max(8,Math.min(48+n*30,W-width-8));
  const top=o.y!=null?o.y:Math.max(8,Math.min(24+n*26,H-height-8));
  Object.assign(node.style,{width:width+'px',height:height+'px',left:left+'px',top:top+'px'});
  const w={id:++wid,app:id,node,title:a.title,min:false,max:false,cleanup:[],body:$('.body',node)};
  w.setTitle=t=>{w.title=t;$('.ti b',node).textContent=t;if(w.tb)$('span',w.tb).textContent=t};
  w.close=()=>closeWin(w);
  w.tb=el('button','task',`${ic(a.icon,16)}<span></span>`);w.tb.type='button';
  w.tb.onclick=()=>{if(w.min||focused!==w)focusWin(w);else minWin(w)};
  tasks.append(w.tb);desk.append(node);wins.set(w.id,w);
  $('.ctl',node).addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.a;if(k==='min')minWin(w);else if(k==='max')maxWin(w);else closeWin(w);
  });
  const tb=$('.tb',node);
  tb.addEventListener('dblclick',e=>{if(!e.target.closest('button'))maxWin(w)});
  tb.addEventListener('pointerdown',e=>{
    focusWin(w);if(e.target.closest('button')||w.max)return;
    const sx=e.clientX,sy=e.clientY,ox=node.offsetLeft,oy=node.offsetTop;
    tb.setPointerCapture(e.pointerId);
    const mv=ev=>{
      const Wd=desk.clientWidth,Hd=desk.clientHeight;
      node.style.left=Math.min(Wd-80,Math.max(80-node.offsetWidth,ox+ev.clientX-sx))+'px';
      node.style.top=Math.min(Hd-36,Math.max(0,oy+ev.clientY-sy))+'px';
    };
    const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up);tb.removeEventListener('pointercancel',up)};
    tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up);tb.addEventListener('pointercancel',up);
  });
  const rs=$('.rs',node);
  rs.addEventListener('pointerdown',e=>{
    e.preventDefault();focusWin(w);
    const sx=e.clientX,sy=e.clientY,ow=node.offsetWidth,oh=node.offsetHeight;
    rs.setPointerCapture(e.pointerId);
    const mv=ev=>{
      node.style.width=Math.max(260,Math.min(desk.clientWidth-node.offsetLeft,ow+ev.clientX-sx))+'px';
      node.style.height=Math.max(160,Math.min(desk.clientHeight-node.offsetTop,oh+ev.clientY-sy))+'px';
    };
    const up=()=>{rs.removeEventListener('pointermove',mv);rs.removeEventListener('pointerup',up);rs.removeEventListener('pointercancel',up)};
    rs.addEventListener('pointermove',mv);rs.addEventListener('pointerup',up);rs.addEventListener('pointercancel',up);
  });
  node.addEventListener('pointerdown',()=>{if(focused!==w)focusWin(w)},true);
  w.setTitle(a.title);
  a.mount(w,w.body,o);
  if(small)maxWin(w);
  focusWin(w);
  return w;
}
function syncTasks(){
  for(const w of wins.values()){
    w.tb.classList.toggle('on',focused===w&&!w.min);
    w.tb.classList.toggle('min',w.min);
    w.node.classList.toggle('focus',focused===w);
  }
}
function focusWin(w){
  if(w.min){w.min=false;w.node.classList.remove('min')}
  w.node.style.zIndex=++zTop;focused=w;syncTasks();
  closeMenu();
}
function topWin(){let t=null;for(const w of wins.values())if(!w.min&&(!t||+w.node.style.zIndex>+t.node.style.zIndex))t=w;return t}
function minWin(w){w.min=true;w.node.classList.add('min');focused=topWin();syncTasks()}
function maxWin(w){w.max=!w.max;w.node.classList.toggle('max',w.max)}
function closeWin(w){
  w.cleanup.forEach(f=>{try{f()}catch(e){}});
  w.node.remove();w.tb.remove();wins.delete(w.id);
  focused=topWin();syncTasks();
}

/* start menu, taskbar, desktop icons */
const menu=$('#menu'),startBtn=$('#start');
startBtn.innerHTML=`${ic('logo',20)}<span>MARSHMELLO</span>`;
menu.innerHTML=`<label class="sr" for="msearch">Search apps</label><input id="msearch" placeholder="Search apps" autocomplete="off"><div class="list"></div><div class="foot"><button type="button" class="btn" data-k="restart">Restart</button><button type="button" class="btn" data-k="reset">Reset files</button></div>`;
const mlist=$('.list',menu),msearch=$('#msearch');
function fillMenu(q=''){
  mlist.innerHTML='';
  for(const [id,a] of Object.entries(APPS)){
    if(q&&!a.title.toLowerCase().includes(q.toLowerCase()))continue;
    const b=el('button','item',`${ic(a.icon,20)}<span>${a.title}</span>`);b.type='button';
    b.onclick=()=>{closeMenu();openApp(id)};mlist.append(b);
  }
}
function openMenu(){fillMenu();msearch.value='';menu.hidden=false;startBtn.setAttribute('aria-expanded','true');msearch.focus()}
function closeMenu(){if(menu.hidden)return;menu.hidden=true;startBtn.setAttribute('aria-expanded','false')}
startBtn.onclick=()=>menu.hidden?openMenu():closeMenu();
msearch.addEventListener('input',()=>fillMenu(msearch.value));
msearch.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('.item',mlist);if(f)f.click()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!e.target.closest('#menu')&&!e.target.closest('#start'))closeMenu()});
menu.addEventListener('click',e=>{
  const k=e.target.closest('[data-k]');if(!k)return;
  closeMenu();
  if(k.dataset.k==='restart')restart();
  if(k.dataset.k==='reset'){FS=defaultFS();changed()}
});
const icons=$('#icons');
for(const [id,a] of Object.entries(APPS)){
  const b=el('button','dicon',`<span class="tile">${ic(a.icon,24)}</span><span>${a.title}</span>`);b.type='button';
  b.onclick=e=>{
    $$('.dicon').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    if(coarse||e.detail===0)openApp(id);
  };
  b.ondblclick=()=>openApp(id);
  icons.append(b);
}
function $$(s){return [...document.querySelectorAll(s)]}
desk.addEventListener('pointerdown',e=>{if(e.target===desk||e.target===icons)$$('.dicon').forEach(x=>x.classList.remove('on'))});
const clock=$('#clock');
const tick=()=>{
  const d=new Date();
  clock.innerHTML=`<b>${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</b>${d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}`;
};
tick();setInterval(tick,15000);

function restart(){
  [...wins.values()].forEach(closeWin);
  openDefaults();
}
function openDefaults(){
  const W=desk.clientWidth;
  if(W>=900){
    openApp('terminal',{x:150,y:36});
    openApp('files',{x:Math.max(150,W-620),y:90});
  }else{
    openApp('files');
  }
}

/* Files */
function mountFiles(w,b,o){
  let cwd=o.path||['home','user'],sel=null,kind=null;
  b.innerHTML=`<div class="fbar"><button type="button" class="btn" data-k="up">${ic('up',14)} Up</button><div class="path"></div><button type="button" class="btn" data-k="open">Open</button><button type="button" class="btn" data-k="nd">New folder</button><button type="button" class="btn" data-k="nf">New file</button><button type="button" class="btn" data-k="del">Delete</button></div>
  <form class="addrow" hidden><label class="sr" for="fa${w.id}">Name</label><input id="fa${w.id}" placeholder="Name" autocomplete="off"><button class="btn pri">Create</button><button type="button" class="btn" data-k="cancel">Cancel</button></form>
  <div class="fmain"><nav class="places" aria-label="Places"></nav><div class="flist"></div></div><div class="fstat"></div>`;
  const path=$('.path',b),list=$('.flist',b),stat=$('.fstat',b),form=$('.addrow',b),ain=$('input',form),places=$('.places',b);

/* Terminal */
function mountTerm(w,b){
  let cwd=['home','user'];
  b.innerHTML=`<div class="term"><div class="out"></div><form class="in"><span class="ps"></span><input autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command"></form></div>`;
  const term=$('.term',b),out=$('.out',b),form=$('.in',b),inp=$('input',b),ps=$('.ps',form);
  const hist=[];let hi=0;
  const pretty=()=>{const p=toPath(cwd);return p==='/home/user'?'~':p.startsWith('/home/user/')?'~'+p.slice(10):p};
  const setPs=()=>{ps.textContent='user@marshmello:'+pretty()+'$'};
  const scroll=()=>{term.scrollTop=term.scrollHeight};
  const print=(t,c)=>{const d=el('div',c||'');d.textContent=t;out.append(d);scroll()};
  const html=h=>{out.append(el('div','',h));scroll()};
  const R=a=>norm(a,toPath(cwd));
  const ents=n=>Object.entries(n.c).sort((a,c)=>a[1].t===c[1].t?a[0].localeCompare(c[0]):a[1].t==='d'?-1:1);
  const clone=n=>JSON.parse(JSON.stringify(n));
  const HELP=`Commands
  ls [-l] [path]      list files           cd [path]         change folder
  pwd                 current folder       cat <file>        show a file
  mkdir <name>        new folder           touch <file>      new empty file
  echo text [> file]  print or write       rm [-r] <path>    delete
  mv <from> <to>      move or rename       cp <from> <to>    copy
  open <app|file>     open an app or file  apps              list apps
  ps / kill <id>      windows              theme <mode>      light, dark or auto
  neofetch            system summary       date, whoami, history, clear, reboot`;
  function run(line){
    html(`<span class="ps">${esc(ps.textContent)}</span> ${esc(line)}`);
    const toks=(line.match(/"[^"]*"|'[^']*'|\S+/g)||[]).map(t=>/^["'].*["']$/.test(t)?t.slice(1,-1):t);
    if(!toks.length)return;
    const [cmd,...args]=toks;
    const err=m=>print(m,'err');
    switch(cmd){
      case 'help':print(HELP);break;
      case 'clear':out.innerHTML='';break;
      case 'pwd':print(toPath(cwd));break;
      case 'whoami':print('user');break;
      case 'date':print(new Date().toString());break;
      case 'history':print(hist.map((h,i)=>String(i+1).padStart(3)+'  '+h).join('\n'));break;
      case 'reboot':restart();break;
      case 'apps':print(Object.keys(APPS).join('  '));break;
      case 'ls':{
        const long=args.includes('-l'),t=args.find(a=>!a.startsWith('-')),parts=t?R(t):cwd,n=get(parts);
        if(!n)return err(`ls: cannot access '${t}': No such file or directory`);
        if(n.t==='f')return print(t);
        const e=ents(n);if(!e.length)return;
        const nm=([k,v])=>v.t==='d'?`<span class="d">${esc(k)}/</span>`:esc(k);
        html(long?e.map(x=>`${x[1].t==='d'?'d':'-'}rw-  ${String(x[1].t==='d'?Object.keys(x[1].c).length:x[1].c.length).padStart(6)}  ${nm(x)}`).join('\n'):e.map(nm).join('  '));
        break;
      }
      case 'cd':{
        const p=args[0]?R(args[0]):['home','user'],n=get(p);
        if(!n)return err(`cd: ${args[0]}: No such file or directory`);
        if(n.t!=='d')return err(`cd: ${args[0]}: Not a directory`);
        cwd=p;setPs();break;
      }
      case 'cat':{
        if(!args.length)return err('cat: missing file name');
        for(const a of args){const n=get(R(a));if(!n)err(`cat: ${a}: No such file or directory`);else if(n.t==='d')err(`cat: ${a}: Is a directory`);else print(n.c)}
        break;
      }
      case 'mkdir':{
        if(!args.length)return err('mkdir: missing name');
        for(const a of args){const e=mk(R(a),'d');if(e)err(`mkdir: ${a}: ${e}`)}break;
      }
      case 'touch':{
        if(!args.length)return err('touch: missing file name');
        for(const a of args){if(!get(R(a))){const e=mk(R(a),'f');if(e)err(`touch: ${a}: ${e}`)}}break;
      }
      case 'echo':{
        const i=args.findIndex(a=>a==='>'||a==='>>');
        if(i<0)return print(args.join(' '));
        const text=args.slice(0,i).join(' '),tgt=args[i+1];
        if(!tgt)return err('echo: missing file after redirect');
        const parts=R(tgt),ex=get(parts);
        const e=writeFile(parts,args[i]==='>>'&&ex&&ex.t==='f'?ex.c+text+'\n':text+'\n');
        if(e)err(`echo: ${tgt}: ${e}`);break;
      }
      case 'rm':{
        const rec=args.includes('-r'),t=args.filter(a=>!a.startsWith('-'));
        if(!t.length)return err('rm: missing path');
        for(const a of t){
          const n=get(R(a));if(!n){err(`rm: ${a}: No such file or directory`);continue}
          if(n.t==='d'&&!rec){err(`rm: ${a}: Is a folder (use -r)`);continue}
          const e=rmNode(R(a));if(e)err(`rm: ${a}: ${e}`);
        }
        break;
      }
      case 'mv':case 'cp':{
        if(args.length<2)return err(`${cmd}: needs a source and a destination`);
        const sp=R(args[0]),dp=R(args[1]),s=get(sp);
        if(!s)return err(`${cmd}: ${args[0]}: No such file or directory`);
        let d=get(dp),target=dp;
        if(d&&d.t==='d')target=[...dp,sp[sp.length-1]];
        if(!sp.length)return err(`${cmd}: cannot move the root folder`);
        if(toPath(target).startsWith(toPath(sp)+'/'))return err(`${cmd}: cannot copy a folder into itself`);
        const par=get(target.slice(0,-1));
        if(!par||par.t!=='d'||!target.length)return err(`${cmd}: ${args[1]}: No such directory`);
        const copy=clone(s);
        if(cmd==='mv')rmNode(sp);
        get(target.slice(0,-1)).c[target[target.length-1]]=copy;changed();break;
      }
      case 'ps':html('<span class="m">ID  APP        TITLE</span>\n'+([...wins.values()].map(x=>`${String(x.id).padEnd(3)} ${x.app.padEnd(10)} ${esc(x.title)}`).join('\n')||'(no windows)'));break;
      case 'kill':{
        const x=wins.get(+args[0]);if(!x)return err(`kill: no window with id ${args[0]||''}`);closeWin(x);break;
      }
      case 'theme':{
        if(!['light','dark','auto'].includes(args[0]))return err('usage: theme light|dark|auto');
        prefs.theme=args[0];applyPrefs();savePrefs();print('Theme set to '+args[0]);break;
      }
      case 'open':{
        if(!args.length)return err('usage: open <app or file>');
        const a=args[0].toLowerCase();
        if(APPS[a]){openApp(a);break}
        const n=get(R(args[0]));
        if(!n)return err(`open: ${args[0]}: not an app or file`);
        if(n.t==='d')openApp('files',{path:R(args[0])});else openApp('notes',{path:R(args[0])});
        break;
      }
      case 'neofetch':{
        const up=Math.floor((Date.now()-t0)/1000),m=Math.floor(up/60);
        html(`<span class="d">user</span>@<span class="d">marshmello</span>\n------------\nOS       MARSHMELLO 1.0\nHost     your browser\nShell    hsh\nUptime   ${m?m+' min ':''}${up%60} s\nWindows  ${wins.size}\nFiles    ${countFiles(FS)}\nDisplay  ${innerWidth}x${innerHeight}\nTheme    ${prefs.theme}`);
        break;
      }
      default:err(`${cmd}: command not found. Type "help" for a list.`);
    }
  }
  form.addEventListener('submit',e=>{
    e.preventDefault();const v=inp.value;inp.value='';
    if(v.trim()){hist.push(v);hi=hist.length}
    run(v);
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);inp.value=hist[hi]}
    if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||''}
  });
  term.addEventListener('click',()=>{if(!String(getSelection()))inp.focus()});
  print('MARSHMELLO 1.0  (hsh)\nType "help" to see what you can do.','m');
  setPs();
  if(!coarse)setTimeout(()=>inp.focus(),30);
}

/* Calculator */
function mountCalc(w,b){
  let cur='0',prev=null,op=null,fresh=true,expr='';
  b.innerHTML=`<div class="calc" tabindex="0" aria-label="Calculator"><div class="cdisp"><small></small><output aria-live="polite">0</output></div><div class="ckeys"></div></div>`;
  const root=$('.calc',b),small=$('small',b),outp=$('output',b),keys=$('.ckeys',b);
  const fmt=n=>isFinite(n)?String(parseFloat(n.toPrecision(12))):'Error';
  const calc=(a,c,o)=>o==='+'?a+c:o==='−'?a-c:o==='×'?a*c:c===0?NaN:a/c;
  const show=()=>{outp.textContent=cur;small.textContent=expr};
  function press(k){
    if(/^\d$/.test(k)){if(fresh){cur=k;fresh=false}else if(cur.length<14)cur=cur==='0'?k:cur+k}
    else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
    else if(k==='AC'){cur='0';prev=null;op=null;fresh=true;expr=''}
    else if(k==='±'){if(cur!=='0'&&cur!=='Error')cur=cur.startsWith('-')?cur.slice(1):'-'+cur}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100);fresh=true}
    else if(k==='='){if(op!==null){const r=calc(prev,parseFloat(cur),op);expr=`${fmt(prev)} ${op} ${cur} =`;cur=fmt(r);prev=null;op=null;fresh=true}}
    else{
      if(op!==null&&!fresh){const r=calc(prev,parseFloat(cur),op);prev=r;cur=fmt(r)}else prev=parseFloat(cur);
      op=k;fresh=true;expr=`${fmt(prev)} ${op}`;
    }
    show();
  }
  const layout=['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  for(const k of layout){
    const x=el('button',(/[÷×−+]/.test(k)?'op ':'')+(k==='='?'eq ':'')+(k==='0'?'z':''),k);x.type='button';
    x.onclick=()=>press(k);keys.append(x);
  }
  const map={'/':'÷','*':'×','-':'−','+':'+','Enter':'=','=':'=','Escape':'AC','%':'%','.':'.'};
  root.addEventListener('keydown',e=>{
    if(/^\d$/.test(e.key))press(e.key);else if(map[e.key]){e.preventDefault();press(map[e.key])}
    else if(e.key==='Backspace'&&!fresh){cur=cur.length>1?cur.slice(0,-1):'0';show()}
  });
  show();
}

    g.fillStyle='#2f5a4d';g.beginPath();g.moveTo(0,420);g.lineTo(0,360);g.quadraticCurveTo(220,310,420,370);g.quadraticCurveTo(580,400,720,350);g.lineTo(720,420);g.fill();

  let last=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);last=pt(e);dot(last)});
  function dot(p){g.fillStyle=erase?'#fff':color;g.beginPath();g.arc(p[0],p[1],range.value/2,0,7);g.fill()}

}

/* Weather: search any city, then show its live forecast (Open-Meteo, no key needed) */
function mountWeather(w,b){
  const KEY='halcyon.wx.city',UKEY='halcyon.wx.unit';
  let city=null,unit='F',ctl=null;
  try{const c=JSON.parse(localStorage.getItem(KEY)||'null');if(c&&typeof c.name==='string'&&isFinite(c.lat)&&isFinite(c.lon))city=c;if(localStorage.getItem(UKEY)==='C')unit='C'}catch(e){}
  const SAMPLE={place:'Sample forecast',sample:true,cur:{t:50,text:'Clear',kind:'sun',day:false},
    days:[['2026-11-10',58,43,10,'sun'],['2026-11-11',60,45,10,'sun'],['2026-11-12',57,44,75,'rain'],['2026-11-13',44,38,40,'cloud'],['2026-11-14',46,37,15,'partly'],['2026-11-15',50,37,0,'sun'],['2026-11-16',52,35,10,'sun']]};
  const KIND=c=>c===0?'sun':c<=2?'partly':c===3?'cloud':(c===45||c===48)?'fog':(c>=51&&c<=67)||(c>=80&&c<=82)?'rain':(c>=71&&c<=77)||c===85||c===86?'snow':c>=95?'storm':'cloud';
  const TEXT={sun:'Clear',partly:'Partly cloudy',cloud:'Cloudy',fog:'Fog',rain:'Rain',snow:'Snow',storm:'Thunderstorm'};
  const pd=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
  b.innerHTML=`<div class="wx"><form class="wsearch"><label class="sr" for="ws${w.id}">City</label><input id="ws${w.id}" placeholder="Search for your city" autocomplete="off"><button class="btn pri">Search</button><button type="button" class="btn" data-k="unit" aria-label="Switch temperature unit"></button></form><div class="wres" hidden></div><p class="wmsg" aria-live="polite" hidden></p><section class="wnow"></section><h4 class="wlabel whead" hidden>Next days</h4><ul class="wdays"></ul><p class="wfine"></p></div>`;
  const form=$('.wsearch',b),inp=$('input',form),unitBtn=$('[data-k=unit]',b),res=$('.wres',b),msg=$('.wmsg',b),hero=$('.wnow',b),head=$('.whead',b),list=$('.wdays',b),fine=$('.wfine',b);
  const say=(t,bad)=>{msg.hidden=!t;msg.textContent=t||'';msg.classList.toggle('bad',!!bad)};
  const syncUnit=()=>{unitBtn.textContent='°'+unit;unitBtn.title='Showing °'+unit+'. Click to switch.'};
  const cv=f=>unit==='C'?Math.round((f-32)*5/9):Math.round(f);
  function show(d){
    const days=d.days;
    const dn=(s,i)=>i===0?'Today':i===1?'Tomorrow':pd(s).toLocaleDateString([],{weekday:'long'});
    const t=d.cur,td=days[0];
    hero.dataset.k=d.sample?'':(t.kind==='sun'&&!t.day?'night':t.kind);
    if(d.sample)hero.dataset.k='cloud';
    hero.innerHTML=`<div class="wl"><span class="wplace"></span><b class="wbig"></b><span class="wdesc"></span><span class="whl"></span></div><span class="wico hero">${ic(t.kind==='sun'&&!t.day?'w_moon':'w_'+t.kind,84)}</span>`;
    $('.wplace',hero).textContent=d.place;$('.wbig',hero).textContent=cv(t.t)+'°';$('.wdesc',hero).textContent=t.text;
    $('.whl',hero).textContent=td?'High '+cv(td[1])+'° · Low '+cv(td[2])+'°':'';
    list.innerHTML='';
    const rest=days.slice(1);head.hidden=!rest.length;
    const lo=Math.min(...days.map(x=>x[2])),hi=Math.max(...days.map(x=>x[1])),span=Math.max(1,hi-lo);
    rest.forEach((x,i)=>{
      const li=el('li','',`<span class="dn"></span><span class="wico">${ic('w_'+x[4],22)}</span><span class="dp"></span><span class="dl"></span><span class="dbar"><i></i></span><span class="dh"></span>`);
      $('.dn',li).textContent=dn(x[0],i+1);$('.dp',li).textContent=x[3]>=10?x[3]+'%':'';
      $('.dl',li).textContent=cv(x[2])+'°';$('.dh',li).textContent=cv(x[1])+'°';
      const f=$('i',li);f.style.left=((x[2]-lo)/span*100)+'%';f.style.width=Math.max(6,(x[1]-x[2])/span*100)+'%';
      li.setAttribute('aria-label',dn(x[0],i+1)+': high '+cv(x[1])+', low '+cv(x[2])+', '+x[3]+' percent chance of precipitation');
      list.append(li);
    });
    fine.textContent=d.sample?'This is a sample. Search for your city to see its real forecast.':'Forecast from Open-Meteo. Updated when you open this app.';
  }
  async function getJSON(url){
    if(ctl)ctl.abort();ctl=new AbortController();
    const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw new Error('http');return r.json();
  }
  async function load(c){
    say('Loading forecast for '+c.name+'…');
    try{
      const j=await getJSON('https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lon+'&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=7');
      const k=KIND(j.current.weather_code);
      show({place:c.name,cur:{t:j.current.temperature_2m,text:TEXT[k],kind:k,day:j.current.is_day===1},
        days:j.daily.time.map((d,i)=>[d,j.daily.temperature_2m_max[i],j.daily.temperature_2m_min[i],j.daily.precipitation_probability_max[i]||0,KIND(j.daily.weather_code[i])])});
      say('');
    }catch(e){
      if(e&&e.name==='AbortError')return;
      show(SAMPLE);say('Could not load live weather here. Some viewers block outside requests, so the sample is shown. Try the downloaded or hosted copy of this OS.',true);
    }
  }
  async function search(q){
    say('Searching…');res.hidden=true;
    try{
      const j=await getJSON('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=5&language=en&format=json');
      const r=(j&&j.results)||[];
      if(!r.length){say('No city found for "'+q+'". Check the spelling or add a state or country.',true);return}
      say('');res.innerHTML='';res.hidden=false;
      r.forEach(x=>{
        const label=[x.name,x.admin1,x.country].filter(Boolean).join(', ');
        const bt=el('button','wopt');bt.type='button';bt.textContent=label;
        bt.onclick=()=>{city={name:label,lat:x.latitude,lon:x.longitude};try{localStorage.setItem(KEY,JSON.stringify(city))}catch(e){}res.hidden=true;inp.value='';load(city)};
        res.append(bt);
      });
    }catch(e){
      if(e&&e.name==='AbortError')return;
      say('City search is not available here. Some viewers block outside requests. Try the downloaded or hosted copy of this OS.',true);
    }
  }
  let last=null;
  const origShow=show;
  form.addEventListener('submit',e=>{e.preventDefault();const q=inp.value.trim();if(q)search(q)});
  unitBtn.onclick=()=>{unit=unit==='F'?'C':'F';try{localStorage.setItem(UKEY,unit)}catch(e){}syncUnit();if(city)load(city);else show(SAMPLE)};
  w.cleanup.push(()=>{if(ctl)ctl.abort()});
  syncUnit();
  if(city)load(city);else{show(SAMPLE);say('Search for your city to see its forecast.')}
}

/* Games: Snake, Tic-Tac-Toe, Memory */
function mountGames(w,b){
  b.innerHTML=`<div class="gm"><div class="gtabs" role="tablist"></div><div class="gbody"></div></div>`;
  const tabs=$('.gtabs',b),body=$('.gbody',b);
  let stop=null;
  const GAMES=[['snake','Snake',snake],['ttt','Tic-Tac-Toe',ttt],['mem','Memory',memory]];
  const best=k=>{try{return +localStorage.getItem('halcyon.best.'+k)||0}catch(e){return 0}};
  const setBest=(k,v)=>{try{localStorage.setItem('halcyon.best.'+k,String(v))}catch(e){}};
  function open(id){
    if(stop){stop();stop=null}
    body.innerHTML='';
    $$('.gtabs button').forEach(x=>{if(b.contains(x))x.setAttribute('aria-selected',x.dataset.id===id)});
    const g=GAMES.find(x=>x[0]===id);stop=g[2](body)||null;
  }
  for(const [id,name] of GAMES){
    const x=el('button','gtab',name);x.type='button';x.dataset.id=id;x.setAttribute('role','tab');x.onclick=()=>open(id);tabs.append(x);
  }
  w.cleanup.push(()=>{if(stop)stop()});

  function snake(root){
    const N=18,C=20;
    root.innerHTML=`<div class="gcol"><div class="gscore"><span>Score <b class="sc">0</b></span><span>Best <b class="bs">${best('snake')}</b></span></div><div class="sw" tabindex="0" aria-label="Snake board. Use the arrow keys."><canvas width="${N*C}" height="${N*C}"></canvas><div class="sov"><b>Snake</b><span>Press an arrow key or Start</span></div></div><div class="gpad"><span></span><button type="button" data-d="u" aria-label="Up">▲</button><span></span><button type="button" data-d="l" aria-label="Left">◀</button><button type="button" data-d="s" class="go">Start</button><button type="button" data-d="r" aria-label="Right">▶</button><span></span><button type="button" data-d="d" aria-label="Down">▼</button><span></span></div></div>`;
    const cv=$('canvas',root),g=cv.getContext('2d'),ov=$('.sov',root),wrap=$('.sw',root),sc=$('.sc',root),bs=$('.bs',root),goBtn=$('.go',root);
    let s,dir,next,food,score,timer=null,over=false;
    const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
    const cs=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#2f6df6';
    function reset(){s=[[9,9],[8,9],[7,9]];dir=V.r;next=V.r;score=0;over=false;sc.textContent=0;place();draw()}
    function place(){do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(s.some(p=>p[0]===food[0]&&p[1]===food[1]))}
    function draw(){
      g.fillStyle='#10151d';g.fillRect(0,0,N*C,N*C);
      g.fillStyle='rgba(255,255,255,.04)';
      for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)g.fillRect(i*C,j*C,C,C);
      g.fillStyle='#ef6a5b';g.beginPath();g.arc(food[0]*C+C/2,food[1]*C+C/2,C*.36,0,7);g.fill();
      s.forEach((p,i)=>{g.fillStyle=i?cs('--accent'):'#ffffff';g.globalAlpha=i?Math.max(.45,1-i*.03):1;g.fillRect(p[0]*C+1,p[1]*C+1,C-2,C-2)});
      g.globalAlpha=1;
    }
    function step(){
      dir=next;const h=[s[0][0]+dir[0],s[0][1]+dir[1]];
      if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||s.some(p=>p[0]===h[0]&&p[1]===h[1]))return end();
      s.unshift(h);
      if(h[0]===food[0]&&h[1]===food[1]){score++;sc.textContent=score;place()}else s.pop();
      draw();
    }
    function start(){
      if(timer)return;if(over||!s)reset();
      ov.hidden=true;goBtn.textContent='Pause';
      timer=setInterval(step,120);
    }
    function pause(){if(timer){clearInterval(timer);timer=null}goBtn.textContent='Start'}
    function end(){
      pause();over=true;ov.hidden=false;
      if(score>best('snake')){setBest('snake',score);bs.textContent=score}
      ov.innerHTML=`<b>Game over</b><span>Score ${score}. Press an arrow key or Start to play again.</span>`;
    }
    function turn(k){
      const d=V[k];if(!d)return;
      if(over)reset();
      if(d[0]!==-dir[0]||d[1]!==-dir[1])next=d;
      start();
    }
    wrap.addEventListener('keydown',e=>{
      const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'}[e.key];
      if(m){e.preventDefault();turn(m)}
      else if(e.key===' '){e.preventDefault();timer?pause():start()}
    });
    root.addEventListener('click',e=>{
      const k=e.target.closest('[data-d]');if(!k)return;
      const d=k.dataset.d;
      if(d==='s'){timer?pause():start()}else turn(d);
      if(!coarse)wrap.focus();
    });
    reset();if(!coarse)wrap.focus();
    return pause;
  }

  function ttt(root){
    root.innerHTML=`<div class="gcol"><div class="gscore"><span>You (X) <b class="wy">0</b></span><span>Draws <b class="wd">0</b></span><span>Computer (O) <b class="wc">0</b></span></div><div class="tgrid"></div><p class="gmsg" aria-live="polite">Your move.</p><button type="button" class="btn">New game</button></div>`;
    const grid=$('.tgrid',root),msg=$('.gmsg',root);
    const tot={y:0,d:0,c:0};let bd,done,lock=null;
    const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    const win=p=>L.some(l=>l.every(i=>bd[i]===p));
    const cells=[];
    for(let i=0;i<9;i++){const c=el('button','tc');c.type='button';c.setAttribute('aria-label','Square '+(i+1));c.onclick=()=>play(i);grid.append(c);cells.push(c)}
    function paint(){bd.forEach((v,i)=>{cells[i].textContent=v;cells[i].dataset.p=v;cells[i].disabled=!!v||done})}
    function fin(t){done=true;paint();if(t==='X'){tot.y++;msg.textContent='You win!'}else if(t==='O'){tot.c++;msg.textContent='Computer wins.'}else{tot.d++;msg.textContent="It's a draw."}
      $('.wy',root).textContent=tot.y;$('.wd',root).textContent=tot.d;$('.wc',root).textContent=tot.c}
    function reset(){clearTimeout(lock);bd=Array(9).fill('');done=false;msg.textContent='Your move.';paint()}
    function pick(){
      const find=p=>{for(const l of L){const v=l.map(i=>bd[i]);if(v.filter(x=>x===p).length===2&&v.includes('')) return l[v.indexOf('')]}return -1};
      let m=find('O');if(m<0)m=find('X');
      if(m<0&&!bd[4])m=4;
      if(m<0){const o=[0,2,6,8,1,3,5,7].filter(i=>!bd[i]);m=o[Math.floor(Math.random()*o.length)]}
      return m;
    }
    function play(i){
      if(done||bd[i]||lock)return;
      bd[i]='X';paint();
      if(win('X'))return fin('X');
      if(bd.every(Boolean))return fin('');
      msg.textContent='Computer is thinking…';
      lock=setTimeout(()=>{lock=null;bd[pick()]='O';paint();if(win('O'))return fin('O');if(bd.every(Boolean))return fin('');msg.textContent='Your move.'},350);
    }
    $('.btn',root).onclick=reset;
    reset();
    return()=>clearTimeout(lock);
  }

  function memory(root){
    const SY=['★','♦','●','▲','■','♠','♥','✚'];
    root.innerHTML=`<div class="gcol"><div class="gscore"><span>Moves <b class="mv">0</b></span><span>Best <b class="bm">${best('mem')||'-'}</b></span></div><div class="mgrid"></div><p class="gmsg" aria-live="polite">Match all the pairs.</p><button type="button" class="btn">New game</button></div>`;
    const grid=$('.mgrid',root),msg=$('.gmsg',root),mv=$('.mv',root),bm=$('.bm',root);
    let deck,open,moves,matched,lock=null;
    function reset(){
      clearTimeout(lock);lock=null;
      deck=[...SY,...SY].map(v=>[Math.random(),v]).sort((a,c)=>a[0]-c[0]).map(x=>x[1]);
      open=[];moves=0;matched=0;mv.textContent=0;msg.textContent='Match all the pairs.';grid.innerHTML='';
      deck.forEach((v,i)=>{
        const c=el('button','mc');c.type='button';c.setAttribute('aria-label','Card '+(i+1)+', face down');
        c.innerHTML='<span class="mf"></span><span class="mb">?</span>';$('.mf',c).textContent=v;
        c.onclick=()=>flip(i,c);grid.append(c);
      });
    }
    function flip(i,c){
      if(lock||c.classList.contains('up')||c.classList.contains('ok'))return;
      c.classList.add('up');c.setAttribute('aria-label','Card '+(i+1)+', '+deck[i]);open.push([i,c]);
      if(open.length<2)return;
      moves++;mv.textContent=moves;
      const [a,d]=open;
      if(deck[a[0]]===deck[d[0]]){
        a[1].classList.add('ok');d[1].classList.add('ok');open=[];matched++;
        if(matched===SY.length){msg.textContent='You matched them all in '+moves+' moves.';if(!best('mem')||moves<best('mem')){setBest('mem',moves);bm.textContent=moves}}
      }else{
        lock=setTimeout(()=>{lock=null;a[1].classList.remove('up');d[1].classList.remove('up');a[1].setAttribute('aria-label','Card '+(a[0]+1)+', face down');d[1].setAttribute('aria-label','Card '+(d[0]+1)+', face down');open=[]},750);
      }
    }
    $('.btn',root).onclick=reset;
    reset();
    return()=>clearTimeout(lock);
  }
  open('snake');
}

  for(const [v,l] of [['auto','System'],['light','Light'],['dark','Dark']]){
    const x=el('button','btn',l);x.type='button';x.dataset.v=v;x.onclick=()=>{prefs.theme=v;applyPrefs();savePrefs();sync()};G('theme').append(x);
  }
  for(const [l,c] of accents){
    const x=el('button');x.type='button';x.dataset.v=c;x.style.background=c;x.setAttribute('aria-label',l);x.onclick=()=>{prefs.accent=c;applyPrefs();savePrefs();sync()};G('accent').append(x);
  }
  for(const [v,l] of walls){
    const x=el('button');x.type='button';x.dataset.v=v;x.style.background=`var(--wall-${v})`;x.setAttribute('aria-label',l+' wallpaper');x.title=l;x.onclick=()=>{prefs.wall=v;applyPrefs();savePrefs();sync()};G('wall').append(x);
  }
  function sync(){
    for(const k of ['theme','accent','wall'])for(const x of G(k).children)x.setAttribute('aria-pressed',x.dataset.v===prefs[k]);
  }
  $('[data-k=reset]',b).onclick=()=>{FS=defaultFS();changed()};
  sync();
}

applyPrefs(true);
openDefaults();
})();
</script>

</body></html>
