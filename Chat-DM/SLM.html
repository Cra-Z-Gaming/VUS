<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Message</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 15px; background: #111; color: #eee; }
  textarea, input { width: 100%; background: #1b1b1b; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 10px; margin: 5px 0; }
  textarea { min-height: 400px; font: 14px monospace; resize: vertical; }
  button { padding: 10px 14px; margin: 5px 6px 5px 0; border-radius: 5px; border: 1px solid #444; background: #333; color: #fff; cursor: pointer; }
  button:hover { background: #444; }
  .hidden { display: none !important; }
  .status { min-height: 20px; margin-top: 8px; color: #aaa; }
  .status.error { color: #ff6b6b; } .status.success { color: #6bcb77; }
  .meta { font-size: 12px; color: #888; margin: 6px 0; }
  .countdown { font-family: monospace; color: #ffb347; }
  details { margin-top: 28px; border-top: 1px solid #333; padding-top: 12px; } summary { cursor: pointer; color: #aaa; }
</style>
</head>
<body>
<h1>Shared Message</h1>

<div id="idRow">
  <input id="idInput" maxlength="6" placeholder="Share ID (ABC123)">
  <button id="openBtn">Open</button>
</div>

<div id="pwRow" class="hidden">
  <p>This message is locked.</p>
  <input id="pwInput" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit code">
  <button id="unlockBtn">Unlock</button>
</div>

<div id="status" class="status"></div>

<div id="result" class="hidden">
  <div class="meta">Expires in: <span id="countdown" class="countdown"></span></div>
  <textarea id="text" readonly></textarea>
  <button id="copyBtn">Copy</button>
  <button id="dlBtn">Download</button>
  <details>
    <summary>Delete this share</summary>
    <p class="meta">Only people with the delete code can delete it.</p>
    <input id="delInput" placeholder="Delete code (XXXXX-XXXXX)" maxlength="11">
    <button id="delBtn">Delete</button>
  </details>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(async function () {
  // slm.js comes from GitHub as text/plain, so load it the same way Chat-DM.html does.
  var SRC = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/refs/heads/main/Chat-DM/slm.js";
  var $ = function (id) { return document.getElementById(id); };
  var status = function (m, t) { $("status").textContent = m; $("status").className = "status " + (t || ""); };
  try {
    var code = await (await fetch(SRC, { cache: "no-store" })).text();
    await new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = URL.createObjectURL(new Blob([code], { type: "application/javascript" })); s.onload = ok; s.onerror = bad; document.body.appendChild(s); });
  } catch (e) { return status("Couldn't load the viewer code. Check your connection.", "error"); }
  var SLM = window.VUS_SLM, cur = null, timer = null;

  function show(text, expiresAt) {
    $("pwRow").classList.add("hidden"); $("result").classList.remove("hidden");
    $("text").value = text; status("Loaded.", "success");
    clearInterval(timer);
    var tick = function () {
      var ms = expiresAt - Date.now();
      if (ms <= 0) { clearInterval(timer); $("countdown").textContent = "expired"; $("text").value = ""; return status("This share just expired.", "error"); }
      var s = Math.floor(ms / 1000); $("countdown").textContent = Math.floor(s / 3600) + "h " + Math.floor(s % 3600 / 60) + "m " + s % 60 + "s";
    };
    tick(); timer = setInterval(tick, 1000);
  }
  async function load() {
    var id = $("idInput").value.trim().toUpperCase();
    if (!/^[A-Z0-9]{6}$/.test(id)) return status("Enter a 6-character Share ID.", "error");
    status("Loading\u2026"); $("result").classList.add("hidden"); $("pwRow").classList.add("hidden");
    var s = await SLM.fetchShare(id);
    if (!s) return status("Share not found, expired, or deleted.", "error");
    cur = { id: id, s: s };
    if (s.protected) { $("pwRow").classList.remove("hidden"); status(""); $("pwInput").focus(); } else show(s.code, s.expiresAt);
  }
  $("openBtn").onclick = load;
  $("idInput").oninput = function (e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); };
  $("idInput").onkeydown = function (e) { if (e.key === "Enter") load(); };
  $("pwInput").oninput = function (e) { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); };
  $("unlockBtn").onclick = async function () {
    if (!cur) return;
    try { show(await SLM.unlock(cur.s.code, $("pwInput").value), cur.s.expiresAt); } catch (e) { status("Incorrect code.", "error"); }
  };
  $("pwInput").onkeydown = function (e) { if (e.key === "Enter") $("unlockBtn").click(); };
  $("copyBtn").onclick = function () { navigator.clipboard.writeText($("text").value).then(function () { $("copyBtn").textContent = "Copied!"; setTimeout(function () { $("copyBtn").textContent = "Copy"; }, 1500); }); };
  $("dlBtn").onclick = function () { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([$("text").value], { type: "text/plain" })); a.download = cur.id + ".txt"; a.click(); };
  $("delBtn").onclick = async function () {
    if (!cur || !confirm("Delete this share permanently?")) return;
    try { await SLM.destroy(cur.id, $("delInput").value); clearInterval(timer); $("text").value = ""; $("result").classList.add("hidden"); status("Share deleted.", "success"); }
    catch (e) { status("Wrong delete code.", "error"); }
  };
  var q = new URLSearchParams(location.search).get("id");
  if (q) { $("idInput").value = q.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6); load(); }
})();
</script>
</body>
</html>
